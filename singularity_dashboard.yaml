            content: |
              ![Board 1](https://raw.githubusercontent.com/exoticatom/singularity/main/assets/ESP32-S3-Devkit-n16r8_2.jpg)

              **Waveshare ESP32-S3-DEV-KIT-N16R8** — original development board

