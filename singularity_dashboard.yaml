      # ── Pinout & I2C ─────────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Pinout & I2C
            heading_style: title
            icon: mdi:pin

          - type: markdown
            title: singularity — Pin Assignments
            content: |
              | GPIO | Function | Role | Status |
              |---|---|---|---|
              | GPIO 21 | SDA | I2C data — ADS1115 | ✅ in use |
              | GPIO 47 | SCL | I2C clock — ADS1115 | ✅ in use |
              | GPIO 48 | 1-Wire DQ | DS18B20 sensors | ✅ in use |
              | GPIO 41 | SSR1 | Relay output | ✅ in use |
              | GPIO 42 | SSR2 | Relay output | ✅ in use |
              | GPIO 43 | U0TXD | UART0 TX — reserved | ❌ reserved |
              | GPIO 44 | U0RXD | UART0 RX — reserved | ❌ reserved |
              | GPIO 19 | USB_D− | USB data — reserved | ❌ reserved |
              | GPIO 20 | USB_D+ | USB data — reserved | ❌ reserved |
              | GPIO 26–32 | Flash/PSRAM | Internal — do not use | ❌ reserved |
              | GPIO 0 | BOOT | Strapping pin | ⚠️ caution |
              | GPIO 45 | VSPI | Strapping pin | ⚠️ caution |
              | GPIO 46 | LOG | Strapping pin | ⚠️ caution |

          - type: markdown
            title: I2C Bus — Connected Devices
            content: |
              **Bus:** SDA = GPIO 21 | SCL = GPIO 47

              | Address | Device | Role |
              |---|---|---|
              | 0x48 | ADS1115 #1 | ADC — NTC1-RIMS (A0), NTC2-MASH (A1), FLOW1 (A2, planned), FLOW2 (A3, planned) |
              | 0x60 | MCP4728 #1 | DAC — Proportional valve + 3 spare (planned) |
              | 0x61 | MCP4728 #2 | DAC — 4 spare outputs (planned) |

