# singularity_dashboard.yaml
#
# Project: singularity
# Purpose: Home Assistant Lovelace dashboard for the singularity brewing
#          controller. Auto-deployed to /config/ via CI/CD on every push
#          to main. Loaded by HA via lovelace.dashboards.singularity-brewing
#          in configuration.yaml.
#
# Tabs:
#   1. Brewing Temperatures — live sensors, graphs, status, alarms
#   2. Brew Session         — target setpoints, notes, session log
#   3. Hardware             — pinout diagrams, pin assignments, I2C map

title: singularity
views:

  # ── Tab 1: Brewing Temperatures ─────────────────────────────────────────────
  - title: Brewing Temperatures
    path: singularity-temps
    icon: mdi:thermometer
    cards:

      # ── 1. Device Status ────────────────────────────────────────────────────
      - type: entities
        title: singularity — Device Status
        show_header_toggle: false
        entities:
          - entity: binary_sensor.singularity_status
            name: ESP32 Online
            icon: mdi:chip
          - entity: sensor.singularity_wifi_signal
            name: Wi-Fi Signal (RSSI)
            icon: mdi:wifi
          - entity: sensor.singularity_uptime
            name: Uptime
            icon: mdi:clock-outline
          - entity: update.singularity_firmware
            name: Firmware
            icon: mdi:chip-outline

      # ── 2. Temperature Sensors with Last Updated ────────────────────────────
      - type: entities
        title: singularity — Temperature Sensors
        show_header_toggle: false
        entities:
          - entity: sensor.ntc1_rims
            name: NTC1-RIMS
            icon: mdi:thermometer-water
            secondary_info: last-changed
          - entity: sensor.ntc2_mash
            name: NTC2-MASH
            icon: mdi:thermometer
            secondary_info: last-changed
          - entity: sensor.ds18b20_kettle
            name: DS18B20-Kettle
            icon: mdi:thermometer-lines
            secondary_info: last-changed

      # ── 3. Temperature History Graphs ───────────────────────────────────────
      - type: history-graph
        title: RIMS Temperature — Last 2h
        hours_to_show: 2
        refresh_interval: 30
        entities:
          - entity: sensor.ntc1_rims
            name: NTC1-RIMS
          - entity: input_number.singularity_target_rims
            name: Target RIMS

      - type: history-graph
        title: Mash Temperature — Last 2h
        hours_to_show: 2
        refresh_interval: 30
        entities:
          - entity: sensor.ntc2_mash
            name: NTC2-MASH
          - entity: input_number.singularity_target_mash
            name: Target Mash

      - type: history-graph
        title: Kettle Temperature — Last 2h
        hours_to_show: 2
        refresh_interval: 30
        entities:
          - entity: sensor.ds18b20_kettle
            name: DS18B20-Kettle

      # ── 6. Alarm Status ─────────────────────────────────────────────────────
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.ntc1_rims
            above: input_number.singularity_temp_alarm_high
        card:
          type: markdown
          content: >
            ## ⚠️ ALARM — NTC1-RIMS HIGH
            Temperature exceeded high alarm threshold!
          card_mod:
            style: |
              ha-card { background: var(--error-color); color: white; }

      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.ntc2_mash
            above: input_number.singularity_temp_alarm_high
        card:
          type: markdown
          content: >
            ## ⚠️ ALARM — NTC2-MASH HIGH
            Temperature exceeded high alarm threshold!
          card_mod:
            style: |
              ha-card { background: var(--error-color); color: white; }

      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.ntc1_rims
            below: input_number.singularity_temp_alarm_low
        card:
          type: markdown
          content: >
            ## ⚠️ ALARM — NTC1-RIMS LOW
            Temperature below low alarm threshold!
          card_mod:
            style: |
              ha-card { background: var(--warning-color); color: white; }

      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.ntc2_mash
            below: input_number.singularity_temp_alarm_low
        card:
          type: markdown
          content: >
            ## ⚠️ ALARM — NTC2-MASH LOW
            Temperature below low alarm threshold!
          card_mod:
            style: |
              ha-card { background: var(--warning-color); color: white; }

  # ── Tab 2: Brew Session ──────────────────────────────────────────────────────
  - title: Brew Session
    path: singularity-session
    icon: mdi:beer-outline
    cards:

      # ── 4. Target Temperature Setpoints ─────────────────────────────────────
      - type: entities
        title: Target Temperatures
        show_header_toggle: false
        entities:
          - entity: input_number.singularity_target_rims
            name: Target RIMS Temp
            icon: mdi:thermometer-chevron-up
          - entity: input_number.singularity_target_mash
            name: Target Mash Temp
            icon: mdi:thermometer-chevron-up

      # ── Alarm Thresholds ─────────────────────────────────────────────────────
      - type: entities
        title: Alarm Thresholds
        show_header_toggle: false
        entities:
          - entity: input_number.singularity_temp_alarm_high
            name: High Temp Alarm
            icon: mdi:thermometer-alert
          - entity: input_number.singularity_temp_alarm_low
            name: Low Temp Alarm
            icon: mdi:thermometer-alert

      # ── 5. Brew Session Notes ────────────────────────────────────────────────
      - type: entities
        title: Brew Session Notes
        show_header_toggle: false
        entities:
          - entity: input_text.singularity_brew_notes
            name: Notes
            icon: mdi:notebook-edit

      # ── Session Temperature Summary ──────────────────────────────────────────
      - type: history-graph
        title: Session Overview — Last 8h
        hours_to_show: 8
        refresh_interval: 60
        entities:
          - entity: sensor.ntc1_rims
            name: RIMS
          - entity: sensor.ntc2_mash
            name: Mash
          - entity: sensor.ds18b20_kettle
            name: Kettle
          - entity: input_number.singularity_target_rims
            name: Target RIMS
          - entity: input_number.singularity_target_mash
            name: Target Mash

  # ── Tab 3: Hardware ───────────────────────────────────────────────────────────
  - title: Hardware
    path: singularity-hardware
    icon: mdi:chip
    cards:

      - type: markdown
        title: ESP32-S3-DEV-KIT-NXRX — Board Overview
        content: |
          ![Board overview](https://raw.githubusercontent.com/exoticatom/singularity/main/assets/ESP32-S3-Devkit-n16r8_2.jpg)

          | Component | Description |
          |---|---|
          | Module | ESP32-S3-WROOM series |
          | USB | USB Type-C (USB & UART combined) |
          | Boot Button | Hold during reset → download mode |
          | Reset Button | Resets the MCU |
          | RGB LED | GPIO 38 (WS2812) |
          | 3.3V Regulator | 5V → 3.3V on-board |

      - type: markdown
        title: ESP32-S3-DEV-KIT-NXRX — Pinout
        content: |
          ![Pinout diagram](https://raw.githubusercontent.com/exoticatom/singularity/main/assets/ESP32-S3-Devkit-n16r8.jpg)

      - type: markdown
        title: singularity — Pin Assignments
        content: |
          | GPIO | Function | Role | Status |
          |---|---|---|---|
          | GPIO 21 | SDA | I2C data — ADS1115 | ✅ in use |
          | GPIO 47 | SCL | I2C clock — ADS1115 | ✅ in use |
          | GPIO 48 | 1-Wire DQ | DS18B20 temperature | ✅ in use |
          | GPIO 43 | U0TXD | UART0 TX — serial console | ❌ reserved |
          | GPIO 44 | U0RXD | UART0 RX — serial console | ❌ reserved |
          | GPIO 19 | USB_D− | USB data | ❌ reserved |
          | GPIO 20 | USB_D+ | USB data | ❌ reserved |
          | GPIO 26–32 | Flash/PSRAM | Internal — do not use | ❌ reserved |
          | GPIO 0 | BOOT | Strapping pin | ⚠️ caution |
          | GPIO 45 | VSPI | Strapping pin | ⚠️ caution |
          | GPIO 46 | LOG | Strapping pin | ⚠️ caution |

      - type: markdown
        title: I2C Bus — Connected Devices
        content: |
          **Bus:** SDA = GPIO 21 | SCL = GPIO 47

          | Address | Device | Role | Status |
          |---|---|---|---|
          | 0x48 | ADS1115 #1 | NTC1-RIMS (A0), NTC2-MASH (A1) | ✅ active |
          | 0x49 | ADS1115 #2 | Flow meters ADC_Port_4–7 | 🔲 planned |
          | 0x60 | MCP4728 #1 | DAC — proportional valve + 3 spare | 🔲 planned |
          | 0x61 | MCP4728 #2 | DAC — 4 spare outputs | 🔲 planned |
