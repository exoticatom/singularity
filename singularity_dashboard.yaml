# singularity_dashboard.yaml
#
# Project: singularity
# Purpose: Home Assistant Lovelace dashboard configuration for the singularity
#          brewing controller. Automatically loaded by HA via the lovelace:
#          dashboards entry in configuration.yaml (key: singularity).
#          Deployed to /config/singularity_dashboard.yaml by the CI/CD workflow.
#          Displays the three temperature sensors defined in esp32_singularity.yaml:
#            • NTC1-RIMS      — RIMS outlet temperature (via ADS1115 A0)
#            • NTC2-MASH      — Mash tun temperature    (via ADS1115 A1)
#            • DS18B20-Kettle — Kettle temperature       (via 1-Wire GPIO 48)

title: singularity
views:
  - title: Brewing Temperatures
    path: singularity-temps
    icon: mdi:thermometer
    cards:
      - type: entities
        title: Temperature Sensors
        show_header_toggle: false
        entities:
          - entity: sensor.singularity_build
            name: "Build"
            icon: mdi:tag-outline
          - entity: sensor.singularity_ds18b20_kettle
            name: DS18B20-Kettle
            icon: mdi:thermometer-lines
          - entity: sensor.singularity_hlt_temperature
            name: HLT Temperature
            icon: mdi:thermometer-lines
          - entity: sensor.singularity_ntc1_rims
            name: NTC1-RIMS
            icon: mdi:thermometer-water
          - entity: sensor.singularity_ntc2_mash
            name: NTC2-MASH
            icon: mdi:thermometer

      # ── RIMS & Mash temperature graph (mini-graph-card) ───────────────────
      # Requires: HACS → mini-graph-card by kalkih
      # ── Brewing Graphs ────────────────────────────────────────────────────
      # Uses native history-graph — handles unavailable sensors gracefully.
      # NTC sensors show as flat/missing when ADS1115 not connected.
      # DS18B20 always shows when connected.
      - type: history-graph
        title: Brewing Graphs
        hours_to_show: 1
        refresh_interval: 10
        entities:
          - entity: sensor.singularity_ds18b20_kettle
            name: Boiling Temp
          - entity: sensor.singularity_hlt_temperature
            name: HLT Temperature
          - entity: sensor.singularity_ntc1_rims
            name: NTC1-RIMS
          - entity: sensor.singularity_ntc2_mash
            name: NTC2-MASH

  - title: Hardware
    path: singularity-hardware
    icon: mdi:chip
    cards:
      - type: markdown
        title: ESP32-S3-DEV-KIT-NXRX — Board Overview
        content: |
          ![Board overview](https://raw.githubusercontent.com/exoticatom/singularity/main/assets/ESP32-S3-Devkit-n16r8_2.jpg)

          | Component | Description |
          |---|---|
          | Module | ESP32-S3-WROOM series |
          | USB | USB Type-C (USB & UART combined) |
          | Boot Button | Hold during reset → download mode |
          | Reset Button | Resets the MCU |
          | RGB LED | GPIO 38 (WS2812) |
          | 3.3V Regulator | 5V → 3.3V on-board |

      - type: markdown
        title: ESP32-S3-DEV-KIT-NXRX — Pinout
        content: |
          ![Pinout diagram](https://raw.githubusercontent.com/exoticatom/singularity/main/assets/ESP32-S3-Devkit-n16r8.jpg)

      - type: markdown
        title: singularity — Pin Assignments
        content: |
          | GPIO | Function | Role | Status |
          |---|---|---|---|
          | GPIO 21 | SDA | I2C data — ADS1115 | ✅ in use |
          | GPIO 47 | SCL | I2C clock — ADS1115 | ✅ in use |
          | GPIO 48 | 1-Wire DQ | DS18B20 temperature | ✅ in use |
          | GPIO 43 | U0TXD | UART0 TX — serial console | ❌ reserved |
          | GPIO 44 | U0RXD | UART0 RX — serial console | ❌ reserved |
          | GPIO 19 | USB_D− | USB data | ❌ reserved |
          | GPIO 20 | USB_D+ | USB data | ❌ reserved |
          | GPIO 26–32 | Flash/PSRAM | Internal — do not use | ❌ reserved |
          | GPIO 0 | BOOT | Strapping pin | ⚠️ caution |
          | GPIO 45 | VSPI | Strapping pin | ⚠️ caution |
          | GPIO 46 | LOG | Strapping pin | ⚠️ caution |

      - type: markdown
        title: I2C Bus — Connected Devices
        content: |
          **Bus:** SDA = GPIO 21 | SCL = GPIO 47

          | Address | Device | Role |
          |---|---|---|
          | 0x48 | ADS1115 #1 | ADC — NTC1-RIMS (A0), NTC2-MASH (A1) |
          | 0x49 | ADS1115 #2 | ADC — Flow meters (planned) |
          | 0x60 | MCP4728 #1 | DAC — Proportional valve + 3 spare (planned) |
          | 0x61 | MCP4728 #2 | DAC — 4 spare outputs (planned) |
