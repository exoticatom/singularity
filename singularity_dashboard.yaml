# singularity_dashboard.yaml
#
# Project: singularity
# Purpose: Home Assistant Lovelace dashboard for the singularity brewing controller.
#          Auto-deployed to /config/ via CI/CD on every push to main.
#
# Sensor naming convention:
#   sensor.singularity_*_raw   — raw ESPHome readings (uncorrected)
#   sensor.*                   — corrected values (raw + offset from Settings tab)
#
# Tabs: Brewing Temperatures | Log | Settings | Hardware

title: singularity
views:

  # ── Tab 1: Brewing Temperatures ─────────────────────────────────────────────
  - title: Brewing Temperatures
    path: singularity-temps
    icon: mdi:thermometer
    cards:

      - type: entities
        title: Temperature Sensors
        show_header_toggle: false
        entities:
          - entity: sensor.singularity_build
            name: "Build"
            icon: mdi:tag-outline
          - entity: sensor.ds18b20_boil
            name: DS18B20-Boil
            icon: mdi:thermometer-lines
          - entity: sensor.ds18b20_hlt
            name: DS18B20-HLT
            icon: mdi:thermometer-lines
          - entity: sensor.ntc1_rims
            name: NTC1-RIMS
            icon: mdi:thermometer-water
          - entity: sensor.ntc2_mash
            name: NTC2-MASH
            icon: mdi:thermometer

      - type: entities
        title: Controls
        show_header_toggle: false
        entities:
          - entity: switch.singularity_ssr1_spare
            name: SSR1 Spare
            icon: mdi:electric-switch
          - entity: switch.singularity_ssr2_rims_heater
            name: SSR2 RIMS Heater
            icon: mdi:fire

      # ── Brewing Graphs ──────────────────────────────────────────────────────
      # Shows corrected sensor values. Handles unavailable sensors gracefully.
      - type: history-graph
        title: Brewing Graphs
        hours_to_show: 1
        refresh_interval: 10
        entities:
          - entity: sensor.ds18b20_boil
            name: Boil
          - entity: sensor.ds18b20_hlt
            name: HLT
          - entity: sensor.ntc1_rims
            name: NTC1-RIMS
          - entity: sensor.ntc2_mash
            name: NTC2-MASH

  # ── Tab 2: Log ───────────────────────────────────────────────────────────────
  - title: Log
    path: singularity-log
    icon: mdi:clipboard-text-clock
    cards:

      - type: entities
        title: Clear Log
        show_header_toggle: false
        entities:
          - type: button
            name: Purge singularity log entries
            icon: mdi:delete-sweep
            action_name: Purge
            tap_action:
              action: perform-action
              perform_action: recorder.purge_entities
              data:
                entity_id:
                  - switch.singularity_ssr1_spare
                  - switch.singularity_ssr2_rims_heater
                keep_days: 0

      - type: logbook
        title: SSR Activity Log
        hours_to_show: 24
        entities:
          - switch.singularity_ssr1_spare
          - switch.singularity_ssr2_rims_heater

  # ── Tab 3: Settings ──────────────────────────────────────────────────────────
  - title: Settings
    path: singularity-settings
    icon: mdi:tune
    cards:

      - type: markdown
        content: >
          ## Temperature Calibration Offsets

          Adjust the offset for each sensor to correct for hardware variance.
          The corrected value shown on the dashboard = RAW + offset.
          Use **+** to increase, **−** to decrease. Range: −10 to +10 °C.

      - type: entities
        title: Sensor Offsets
        show_header_toggle: false
        entities:
          - entity: input_number.singularity_offset_ds18b20_boil
            name: DS18B20-Boil Offset
            icon: mdi:thermometer-plus
          - entity: input_number.singularity_offset_ds18b20_hlt
            name: DS18B20-HLT Offset
            icon: mdi:thermometer-plus
          - entity: input_number.singularity_offset_ntc1_rims
            name: NTC1-RIMS Offset
            icon: mdi:thermometer-plus
          - entity: input_number.singularity_offset_ntc2_mash
            name: NTC2-MASH Offset
            icon: mdi:thermometer-plus

      - type: entities
        title: RAW vs Corrected
        show_header_toggle: false
        entities:
          - entity: sensor.singularity_ds18b20_boil_raw
            name: DS18B20-Boil RAW
            icon: mdi:thermometer-alert
          - entity: sensor.ds18b20_boil
            name: DS18B20-Boil Corrected
            icon: mdi:thermometer-check
          - entity: sensor.singularity_ds18b20_hlt_raw
            name: DS18B20-HLT RAW
            icon: mdi:thermometer-alert
          - entity: sensor.ds18b20_hlt
            name: DS18B20-HLT Corrected
            icon: mdi:thermometer-check
          - entity: sensor.singularity_ntc1_rims_raw
            name: NTC1-RIMS RAW
            icon: mdi:thermometer-alert
          - entity: sensor.ntc1_rims
            name: NTC1-RIMS Corrected
            icon: mdi:thermometer-check
          - entity: sensor.singularity_ntc2_mash_raw
            name: NTC2-MASH RAW
            icon: mdi:thermometer-alert
          - entity: sensor.ntc2_mash
            name: NTC2-MASH Corrected
            icon: mdi:thermometer-check

  # ── Tab 4: Hardware ──────────────────────────────────────────────────────────
  - title: Hardware
    path: singularity-hardware
    icon: mdi:chip
    cards:

      - type: markdown
        title: ESP32-S3-DEV-KIT-NXRX — Board Overview
        content: |
          ![Board overview](https://raw.githubusercontent.com/exoticatom/singularity/main/assets/ESP32-S3-Devkit-n16r8_2.jpg)

          | Component | Description |
          |---|---|
          | Module | ESP32-S3-WROOM series |
          | USB | USB Type-C (USB & UART combined) |
          | Boot Button | Hold during reset → download mode |
          | Reset Button | Resets the MCU |
          | RGB LED | GPIO 38 (WS2812) |
          | 3.3V Regulator | 5V → 3.3V on-board |

      - type: markdown
        title: ESP32-S3-DEV-KIT-NXRX — Pinout
        content: |
          ![Pinout diagram](https://raw.githubusercontent.com/exoticatom/singularity/main/assets/ESP32-S3-Devkit-n16r8.jpg)

      - type: markdown
        title: singularity — Pin Assignments
        content: |
          | GPIO | Function | Role | Status |
          |---|---|---|---|
          | GPIO 21 | SDA | I2C data — ADS1115 | ✅ in use |
          | GPIO 47 | SCL | I2C clock — ADS1115 | ✅ in use |
          | GPIO 48 | 1-Wire DQ | DS18B20 sensors | ✅ in use |
          | GPIO 41 | SSR1 Spare | Relay output | ✅ in use |
          | GPIO 42 | SSR2 RIMS Heater | Relay output | ✅ in use |
          | GPIO 43 | U0TXD | UART0 TX — reserved | ❌ reserved |
          | GPIO 44 | U0RXD | UART0 RX — reserved | ❌ reserved |
          | GPIO 19 | USB_D− | USB data — reserved | ❌ reserved |
          | GPIO 20 | USB_D+ | USB data — reserved | ❌ reserved |
          | GPIO 26–32 | Flash/PSRAM | Internal — do not use | ❌ reserved |
          | GPIO 0 | BOOT | Strapping pin | ⚠️ caution |
          | GPIO 45 | VSPI | Strapping pin | ⚠️ caution |
          | GPIO 46 | LOG | Strapping pin | ⚠️ caution |

      - type: markdown
        title: I2C Bus — Connected Devices
        content: |
          **Bus:** SDA = GPIO 21 | SCL = GPIO 47

          | Address | Device | Role |
          |---|---|---|
          | 0x48 | ADS1115 #1 | ADC — NTC1-RIMS (A0), NTC2-MASH (A1) |
          | 0x49 | ADS1115 #2 | ADC — Flow meters (planned) |
          | 0x60 | MCP4728 #1 | DAC — Proportional valve + 3 spare (planned) |
          | 0x61 | MCP4728 #2 | DAC — 4 spare outputs (planned) |
