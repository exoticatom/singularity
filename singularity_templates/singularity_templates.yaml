# singularity_templates/singularity_templates.yaml  v1.0.7
# include_dir_merge_list format
# Entity ID: binary_sensor.singularity_esp32_fast_status
- binary_sensor:
    - name: "singularity ESP32 Fast Status"
      unique_id: singularity_esp32_fast_status
      device_class: connectivity
      state: "{{ states('sensor.singularity_uptime') not in ['unavailable', 'unknown', 'none'] and (now() - states.sensor.singularity_uptime.last_updated).total_seconds() < 10 }}"
      attributes:
        uptime_seconds: "{{ states('sensor.singularity_uptime') | float(0) | round(1) }}"
        wifi_signal: "{{ states('sensor.singularity_wifi_signal') | default('unknown') }} dBm"
        offline_seconds: "{{ (now() - states.sensor.singularity_uptime.last_updated).total_seconds() | int }}"
