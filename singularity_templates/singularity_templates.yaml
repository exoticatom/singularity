# singularity_templates/singularity_templates.yaml  v1.0.5
#
# Fast-response connectivity sensor — 10-second offline detection.
#
# How it works:
#   - sensor.singularity_uptime publishes seconds-since-boot every 1s
#   - If last_updated goes stale for more than 10s, ESP32 has lost connection
#   - binary_sensor.singularity_esp32_fast_status flips to OFF within ~10s
#
# This is faster than binary_sensor.singularity_esp32_status which uses
# the ESPHome native API keepalive (can take 30-60s to detect offline).
#
# Dashboard banners and status indicators should use:
#   binary_sensor.singularity_esp32_fast_status  (fast — 10s detection)
#   binary_sensor.singularity_esp32_status       (fallback — native ESPHome)
#
# Attributes exposed:
#   uptime_seconds  — current ESP32 uptime in seconds
#   last_seen       — timestamp of last uptime update
#   offline_seconds — how long ago the last update was received

- binary_sensor:
  - name: "ESP32 Fast Status"
    unique_id: singularity_esp32_fast_status
    device_class: connectivity
    state: >
      {{ states('sensor.singularity_uptime') not in ['unavailable', 'unknown', 'none']
         and (as_timestamp(now()) - as_timestamp(states.sensor.singularity_uptime.last_updated)) < 10 }}
    icon: >
      {% if states('sensor.singularity_uptime') not in ['unavailable', 'unknown', 'none']
            and (as_timestamp(now()) - as_timestamp(states.sensor.singularity_uptime.last_updated)) < 10 %}
        mdi:wifi
      {% else %}
        mdi:wifi-off
      {% endif %}
    attributes:
      uptime_seconds: "{{ states('sensor.singularity_uptime') | int(0) }}"
      wifi_signal: "{{ states('sensor.singularity_wifi_signal') | default('unknown') }} dBm"
      last_seen: >
        {% set t = states.sensor.singularity_uptime.last_updated %}
        {{ t.strftime('%H:%M:%S') if t else 'unknown' }}
      offline_seconds: >
        {% set t = states.sensor.singularity_uptime.last_updated %}
        {% if t %}{{ (as_timestamp(now()) - as_timestamp(t)) | int }}{% else %}unknown{% endif %}
