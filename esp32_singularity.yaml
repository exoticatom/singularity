# esp32_singularity.yaml
#
# Project: singularity
# Purpose: ESPHome base node configuration for the ESP32-S3-DevKitC-1 brewing
#          controller. Defines the I2C bus, ADS1115 ADC, two NTC thermistors
#          (NTC1-RIMS and NTC2-MASH) with full Steinhart-Hart calculation on
#          the ESP32, a Dallas 1-Wire bus with two DS18B20 digital temperature
#          sensors with offset correction, and SSR relay outputs.
#
# Sensors:
#   NTC1-RIMS    — ADS1115 A0 — S-H calc on ESP32, all params persisted to flash
#   NTC2-MASH    — ADS1115 A1 — S-H calc on ESP32, all params persisted to flash
#   DS18B20-Boil — 1-Wire GPIO 48 — offset applied on ESP32, persisted to flash
#   DS18B20-HLT  — 1-Wire GPIO 48 — offset applied on ESP32, persisted to flash
#
# Outputs:
#   SSR1 — GPIO 41 — relay output (RESTORE_DEFAULT_OFF)
#   SSR2 — GPIO 42 — RIMS heater, driven exclusively by rims_heater_pwm (slow_pwm 2s)
#
# RIMS Heater Control — dual-mode on GPIO 42:
#   DIRECT mode  — fixed duty cycle (dc_duty_cycle) written directly to slow_pwm
#   PID mode     — incremental PID using ntc1_rims as feedback, output capped at
#                  pid_duty_cycle max. Integral resets to 0 on mode switch.
#   Auto-switch  — while in DIRECT, if ntc1_rims >= (pid_setpoint - pid_switch_threshold)
#                  the mode switches to PID automatically and logs the event.
#   Mode select  — rims_mode select entity (OFF / DIRECT / PID), persisted to flash.
#   Control loop — interval every 2s (matches slow_pwm period).
#
# Design principle: After any restart (planned or mid-brew) the ESP32 restores
#   all calibration parameters and SSR states from flash and continues operating
#   without requiring HA to be available. HA is the UI to change parameters only.
#
# All calibration parameters use restore_value: true — persisted to flash.
# On first boot: initial_value (factory defaults) are used.
# On subsequent boots: last saved flash values are used automatically.
# On_boot logs all active parameter values to the ESPHome log for verification.
#
# Note: DS18B20 ROM addresses are specific to this hardware installation.
#       Re-run ROM discovery if a sensor is replaced.
#
# GPIO assignments (see hardware/gpio_map.md):
#   I2C  SDA → GPIO 21 | SCL → GPIO 47
#   1-Wire Data (DQ) → GPIO 48  (4.7 kΩ pull-up to 3.3V required)
#   SSR1 → GPIO 41 | SSR2 → GPIO 42
#
# Polling: NTC 1s, DS18B20 1s, build version 10s
# Filter:  NTC → S-H lambda + EMA α=0.25 (baked in)
#          DS18B20 → offset lambda + EMA α=0.25 (baked in)
#
# Target board: ESP32-S3-DevKitC-1
# ESPHome version: 2026.8.1

---

# ── RIMS Heater Control — PID runtime state ───────────────────────────────────
# These globals hold the running PID state between control loop ticks.
# They are NOT persisted to flash (no restore_value) — reset to 0 on every boot.
# pid_integral and pid_last_error reset to 0 when switching into PID mode.
globals:
  - id: pid_integral
    type: float
    initial_value: '0.0'
  - id: pid_last_error
    type: float
    initial_value: '0.0'
  - id: pid_last_temp
    type: float
    initial_value: '0.0'

esphome:
  name: singularity
  friendly_name: singularity
  comment: "singularity brewing controller — ESP32-S3-DevKitC-1"
  project:
    name: "exoticatom.singularity"
    version: "1.0.3"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          ESP_LOGI("singularity", "=== BOOT — Active Parameters (from flash) ===");
          ESP_LOGI("singularity", "NTC1-RIMS: R=%.0f Ω  V-ref=%.2fV  A=%.9f  B=%.9f  C=%.12f  Offset=%.1f°C",
            id(ntc1_r_fixed).state, id(ntc1_v_ref).state,
            id(ntc1_sh_a).state, id(ntc1_sh_b).state, id(ntc1_sh_c).state,
            id(ntc1_offset).state);
          ESP_LOGI("singularity", "NTC2-MASH: R=%.0f Ω  V-ref=%.2fV  A=%.9f  B=%.9f  C=%.12f  Offset=%.1f°C",
            id(ntc2_r_fixed).state, id(ntc2_v_ref).state,
            id(ntc2_sh_a).state, id(ntc2_sh_b).state, id(ntc2_sh_c).state,
            id(ntc2_offset).state);
          ESP_LOGI("singularity", "DS18B20-Boil: Offset=%.1f°C", id(ds18b20_boil_offset).state);
          ESP_LOGI("singularity", "DS18B20-HLT:  Offset=%.1f°C", id(ds18b20_hlt_offset).state);
          ESP_LOGI("singularity", "PID: Setpoint=%.1f°C  Kp=%.2f  Ki=%.4f  Kd=%.2f  MaxDuty=%.0f%%",
            id(pid_setpoint).state, id(pid_kp).state, id(pid_ki).state,
            id(pid_kd).state, id(pid_duty_cycle).state);
          ESP_LOGI("singularity", "RIMS: Mode=%s  DirectDuty=%.0f%%  SwitchThreshold=%.1f°C",
            std::string(id(rims_mode).current_option()).c_str(),
            id(dc_duty_cycle).state,
            id(pid_switch_threshold).state);
          ESP_LOGI("singularity", "SSR1: %s", id(ssr1).state ? "ON" : "OFF");
          ESP_LOGI("singularity", "=============================================");

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# ── Logging ────────────────────────────────────────────────────────────────────
# INFO level — hardware bring-up complete, sensors verified.
logger:
  level: INFO

# ── API & OTA ──────────────────────────────────────────────────────────────────
api:
  encryption:
    key: !secret singularity_api_encryption_key
  reboot_timeout: 3min

ota:
  - platform: esphome
    password: !secret singularity_ota_password

# ── Wi-Fi ──────────────────────────────────────────────────────────────────────
wifi:
  ssid: !secret singularity_wifi_ssid
  password: !secret singularity_wifi_password
  ap:
    ssid: "singularity-fallback"
    password: !secret singularity_ap_password
  fast_connect: true

captive_portal:

# ── I2C Bus ────────────────────────────────────────────────────────────────────
i2c:
  sda: GPIO21
  scl: GPIO47
  scan: true
  id: bus_a

# ── ADS1115 — 16-bit ADC (I2C address 0x48) ───────────────────────────────────
ads1115:
  - address: 0x48
    i2c_id: bus_a
    id: ads1115_0x48
    continuous_mode: true

# ── Calibration Parameters ────────────────────────────────────────────────────
# All values persist to ESP32 flash (restore_value: true).
# Initial values are factory defaults — used only on very first boot.
# After any reboot the last saved values are restored automatically.
# HA Settings tab writes new values → saved to flash → used immediately.
number:
  # --- NTC1-RIMS ---
  - platform: template
    name: "NTC1 R-Fixed"
    id: ntc1_r_fixed
    min_value: 1000
    max_value: 20000
    step: 1
    restore_value: true
    initial_value: 9883
    optimistic: true
    unit_of_measurement: "Ω"
    icon: "mdi:resistor"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 R-Fixed: %.0f Ohm", x);

  - platform: template
    name: "NTC1 V-Ref"
    id: ntc1_v_ref
    min_value: 1.0
    max_value: 5.0
    step: 0.01
    restore_value: true
    initial_value: 3.3
    optimistic: true
    unit_of_measurement: "V"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 V-Ref: %.2f V", x);

  - platform: template
    name: "NTC1 SH-A"
    id: ntc1_sh_a
    min_value: 0
    max_value: 0.01
    step: 0.000000001
    restore_value: true
    initial_value: 0.001207071588
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 SH-A: %.9f", x);

  - platform: template
    name: "NTC1 SH-B"
    id: ntc1_sh_b
    min_value: 0
    max_value: 0.01
    step: 0.000000001
    restore_value: true
    initial_value: 0.0002183328996
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 SH-B: %.9f", x);

  - platform: template
    name: "NTC1 SH-C"
    id: ntc1_sh_c
    min_value: 0
    max_value: 0.001
    step: 0.000000001
    restore_value: true
    initial_value: 0.0000001764463641
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 SH-C: %.12f", x);

  - platform: template
    name: "NTC1 Offset"
    id: ntc1_offset
    min_value: -10
    max_value: 10
    step: 0.1
    restore_value: true
    initial_value: 0.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-plus"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 Offset: %.1f degC", x);

  # --- NTC2-MASH ---
  - platform: template
    name: "NTC2 R-Fixed"
    id: ntc2_r_fixed
    min_value: 1000
    max_value: 20000
    step: 1
    restore_value: true
    initial_value: 9902
    optimistic: true
    unit_of_measurement: "Ω"
    icon: "mdi:resistor"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 R-Fixed: %.0f Ohm", x);

  - platform: template
    name: "NTC2 V-Ref"
    id: ntc2_v_ref
    min_value: 1.0
    max_value: 5.0
    step: 0.01
    restore_value: true
    initial_value: 3.3
    optimistic: true
    unit_of_measurement: "V"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 V-Ref: %.2f V", x);

  - platform: template
    name: "NTC2 SH-A"
    id: ntc2_sh_a
    min_value: 0
    max_value: 0.01
    step: 0.000000001
    restore_value: true
    initial_value: 0.001209771862
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 SH-A: %.9f", x);

  - platform: template
    name: "NTC2 SH-B"
    id: ntc2_sh_b
    min_value: 0
    max_value: 0.01
    step: 0.000000001
    restore_value: true
    initial_value: 0.0002173461562
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 SH-B: %.9f", x);

  - platform: template
    name: "NTC2 SH-C"
    id: ntc2_sh_c
    min_value: 0
    max_value: 0.001
    step: 0.000000001
    restore_value: true
    initial_value: 0.0000001848376283
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 SH-C: %.12f", x);

  - platform: template
    name: "NTC2 Offset"
    id: ntc2_offset
    min_value: -10
    max_value: 10
    step: 0.1
    restore_value: true
    initial_value: 0.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-plus"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 Offset: %.1f degC", x);

  # --- DS18B20-Boil offset ---
  - platform: template
    name: "DS18B20-Boil Offset"
    id: ds18b20_boil_offset
    min_value: -10
    max_value: 10
    step: 0.1
    restore_value: true
    initial_value: 0.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-plus"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — DS18B20-Boil Offset: %.1f degC", x);

  # --- DS18B20-HLT offset ---
  - platform: template
    name: "DS18B20-HLT Offset"
    id: ds18b20_hlt_offset
    min_value: -10
    max_value: 10
    step: 0.1
    restore_value: true
    initial_value: 0.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-plus"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — DS18B20-HLT Offset: %.1f degC", x);

  # ── PID Control Parameters ────────────────────────────────────────────────
  # RIMS heater dual-mode control: DIRECT (fixed duty) or PID (closed-loop).
  # All values persist to flash — controller resumes with last known state
  # after any reboot, even without HA available.

  - platform: template
    name: "PID Setpoint"
    id: pid_setpoint
    min_value: 0
    max_value: 100
    step: 0.5
    restore_value: true
    initial_value: 66.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:target"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Setpoint: %.1f degC", x);

  - platform: template
    name: "PID Kp"
    id: pid_kp
    min_value: 0
    max_value: 100
    step: 0.01
    restore_value: true
    initial_value: 2.0
    optimistic: true
    icon: "mdi:alpha-p-circle"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Kp: %.2f", x);

  - platform: template
    name: "PID Ki"
    id: pid_ki
    min_value: 0
    max_value: 10
    step: 0.001
    restore_value: true
    initial_value: 0.005
    optimistic: true
    icon: "mdi:alpha-i-circle"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Ki: %.4f", x);

  - platform: template
    name: "PID Kd"
    id: pid_kd
    min_value: 0
    max_value: 100
    step: 0.01
    restore_value: true
    initial_value: 2.0
    optimistic: true
    icon: "mdi:alpha-d-circle"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Kd: %.2f", x);

  - platform: template
    name: "PID Max Duty Cycle"
    id: pid_duty_cycle
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 50
    optimistic: true
    unit_of_measurement: "%"
    icon: "mdi:percent"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Max Duty Cycle: %.0f%%", x);

  # Direct duty cycle — used in DIRECT mode (full-power heat-up phase)
  - platform: template
    name: "RIMS Direct Duty Cycle"
    id: dc_duty_cycle
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 80
    optimistic: true
    unit_of_measurement: "%"
    icon: "mdi:fire"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — RIMS Direct Duty: %.0f%%", x);

  # Auto-switch threshold — when in DIRECT mode, switches to PID when
  # ntc1_rims >= (pid_setpoint - pid_switch_threshold)
  - platform: template
    name: "RIMS PID Switch Threshold"
    id: pid_switch_threshold
    min_value: 0.5
    max_value: 10.0
    step: 0.5
    restore_value: true
    initial_value: 1.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-chevron-up"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — RIMS Switch Threshold: %.1f degC", x);

# ── RIMS Mode Select ──────────────────────────────────────────────────────────
# Controls which logic drives rims_heater_pwm (GPIO42).
#   OFF    — output forced to 0%, heater disabled
#   DIRECT — fixed dc_duty_cycle written every 2s
#   PID    — incremental PID using ntc1_rims, capped at pid_duty_cycle
# Persisted to flash — restores last active mode on reboot.
# Auto-switch: DIRECT → PID when ntc1_rims >= setpoint − threshold (logged).
select:
  - platform: template
    name: "RIMS Mode"
    id: rims_mode
    options:
      - "OFF"
      - "DIRECT"
      - "PID"
    initial_option: "OFF"
    restore_value: true
    optimistic: true
    icon: "mdi:toggle-switch"
    on_value:
      then:
        - lambda: |-
            // Reset PID state on every mode switch — clean handoff, no integral windup
            id(pid_integral) = 0.0f;
            id(pid_last_error) = 0.0f;
            id(pid_last_temp) = id(ntc1_rims).state;
            ESP_LOGI("singularity", "RIMS MODE → %s  (PID integral reset)", x.c_str());
            if (x == "OFF") {
              id(rims_heater_pwm).set_level(0.0f);
              ESP_LOGI("singularity", "RIMS HEATER OFF");
            }

# ── Sensors ───────────────────────────────────────────────────────────────────
sensor:
  # --- NTC1-RIMS ---
  # Full Steinhart-Hart on ESP32. Returns NAN if disconnected or out of range.
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A0_GND'
    gain: 6.144
    name: "NTC1-RIMS"
    id: ntc1_rims
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - lambda: |-
          float v = x;
          float v_ref = id(ntc1_v_ref).state;
          float r_fixed = id(ntc1_r_fixed).state;
          float a = id(ntc1_sh_a).state;
          float b = id(ntc1_sh_b).state;
          float c = id(ntc1_sh_c).state;
          float offset = id(ntc1_offset).state;
          if (v <= 0 || v >= v_ref) return NAN;
          float r = r_fixed * v / (v_ref - v);
          if (r <= 0) return NAN;
          float lnr = log(r);
          float inv_t = a + b * lnr + c * pow(lnr, 3);
          float temp = (1.0f / inv_t) - 273.15f + offset;
          if (temp < -10 || temp > 150) return NAN;
          return temp;
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # --- NTC2-MASH ---
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A1_GND'
    gain: 6.144
    name: "NTC2-MASH"
    id: ntc2_mash
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - lambda: |-
          float v = x;
          float v_ref = id(ntc2_v_ref).state;
          float r_fixed = id(ntc2_r_fixed).state;
          float a = id(ntc2_sh_a).state;
          float b = id(ntc2_sh_b).state;
          float c = id(ntc2_sh_c).state;
          float offset = id(ntc2_offset).state;
          if (v <= 0 || v >= v_ref) return NAN;
          float r = r_fixed * v / (v_ref - v);
          if (r <= 0) return NAN;
          float lnr = log(r);
          float inv_t = a + b * lnr + c * pow(lnr, 3);
          float temp = (1.0f / inv_t) - 273.15f + offset;
          if (temp < -10 || temp > 150) return NAN;
          return temp;
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # --- DS18B20-Boil (offset applied on ESP32, persisted to flash) ---
  - platform: dallas_temp
    address: 0x750000105cbe3528
    name: "DS18B20-Boil"
    id: ds18b20_kettle
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - lambda: |-
          float offset = id(ds18b20_boil_offset).state;
          return x + offset;
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # --- DS18B20-HLT (offset applied on ESP32, persisted to flash) ---
  - platform: dallas_temp
    address: 0x3100000c31dd5a28
    name: "DS18B20-HLT"
    id: ds18b20_hlt
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - lambda: |-
          float offset = id(ds18b20_hlt_offset).state;
          return x + offset;
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

# ── Connectivity Status ────────────────────────────────────────────────────────
binary_sensor:
  - platform: status
    name: "ESP32 Status"
    id: esp32_status

# ── PWM Output for RIMS Heater ────────────────────────────────────────────────
# GPIO42 owned exclusively by rims_heater_pwm. No gpio switch on this pin.
# Duty is written by the interval control loop below — never directly.
output:
  - platform: slow_pwm
    pin: GPIO42
    id: rims_heater_pwm
    period: 2s

# ── RIMS Heater Control Loop ──────────────────────────────────────────────────
# Runs every 2s (matches slow_pwm period).
#
# OFF    → force output 0%, do nothing else.
# DIRECT → write dc_duty_cycle to output.
#           Auto-switch check: if ntc1_rims >= (setpoint − threshold),
#           switch rims_mode to PID, reset integral, log the event.
# PID    → incremental PID (position form, dt=2s).
#           error     = setpoint − temp
#           integral += error * dt  (clamped: no windup beyond max_duty range)
#           derivative = (error − last_error) / dt
#           output    = Kp*error + Ki*integral + Kd*derivative
#           clamped to [0, pid_duty_cycle] and written to slow_pwm.
interval:
  - interval: 2s
    then:
      - lambda: |-
          const float dt = 2.0f;
          std::string mode = std::string(id(rims_mode).current_option());

          if (mode == "OFF") {
            id(rims_heater_pwm).set_level(0.0f);
            return;
          }

          float temp = id(ntc1_rims).state;
          // Safety: if sensor returns NAN, shut off heater regardless of mode
          if (std::isnan(temp)) {
            id(rims_heater_pwm).set_level(0.0f);
            ESP_LOGW("singularity", "RIMS SAFETY — ntc1_rims NAN, heater OFF");
            return;
          }

          if (mode == "DIRECT") {
            // Auto-switch to PID when close enough to setpoint
            float setpoint  = id(pid_setpoint).state;
            float threshold = id(pid_switch_threshold).state;
            if (temp >= (setpoint - threshold)) {
              id(rims_mode).make_call().set_option("PID").perform();
              ESP_LOGI("singularity", "RIMS AUTO-SWITCH DIRECT→PID  temp=%.2f°C  setpoint=%.1f°C  threshold=%.1f°C",
                       temp, setpoint, threshold);
              // mode switch triggers on_value which resets integral — fall through to PID this tick
              mode = "PID";
            } else {
              float duty = id(dc_duty_cycle).state / 100.0f;
              id(rims_heater_pwm).set_level(duty);
              ESP_LOGD("singularity", "RIMS DIRECT  duty=%.0f%%  temp=%.2f°C",
                       id(dc_duty_cycle).state, temp);
              return;
            }
          }

          if (mode == "PID") {
            float setpoint  = id(pid_setpoint).state;
            float kp        = id(pid_kp).state;
            float ki        = id(pid_ki).state;
            float kd        = id(pid_kd).state;
            float max_duty  = id(pid_duty_cycle).state / 100.0f;

            float error     = setpoint - temp;
            id(pid_integral) += error * dt;

            // Anti-windup: clamp integral so its contribution stays within output range
            float max_i = (ki > 0.0f) ? (max_duty / ki) : 1000.0f;
            if (id(pid_integral) >  max_i) id(pid_integral) =  max_i;
            if (id(pid_integral) < -max_i) id(pid_integral) = -max_i;

            float derivative = (error - id(pid_last_error)) / dt;
            id(pid_last_error) = error;
            id(pid_last_temp)  = temp;

            float output = kp * error + ki * id(pid_integral) + kd * derivative;

            // Clamp output to [0, max_duty]
            if (output < 0.0f)      output = 0.0f;
            if (output > max_duty)  output = max_duty;

            id(rims_heater_pwm).set_level(output);
            ESP_LOGD("singularity", "RIMS PID  temp=%.2f°C  err=%.2f  I=%.4f  D=%.4f  out=%.1f%%",
                     temp, error, id(pid_integral), derivative, output * 100.0f);
          }

# ── SSR Relay Outputs ─────────────────────────────────────────────────────────
# RESTORE_DEFAULT_OFF: first boot = OFF, subsequent reboots = restore last state
# SSR2 (RIMS heater, GPIO42) is driven exclusively via rims_heater_pwm (slow_pwm).
# Control is via the interval loop above — mode select in HA Settings tab.
switch:
  - platform: gpio
    pin: GPIO41
    name: "SSR1"
    id: ssr1
    icon: "mdi:electric-switch"
    restore_mode: RESTORE_DEFAULT_OFF

# ── Dallas (1-Wire) Bus ────────────────────────────────────────────────────────
one_wire:
  - platform: gpio
    pin: GPIO48

# ── Build Version ─────────────────────────────────────────────────────────────
text_sensor:
  - platform: template
    name: "Build"
    id: firmware_version
    icon: "mdi:tag-outline"
    lambda: |-
      return {"v1.0.3"};
    update_interval: 10s
