# esp32_singularity.yaml
#
# Project: singularity
# Purpose: ESPHome base node configuration for the ESP32-S3-DevKitC-1 brewing
#          controller. Defines the I2C bus, ADS1115 ADC, two NTC thermistors
#          (NTC1-RIMS and NTC2-MASH) read from the ADS1115, a Dallas
#          1-Wire bus with two DS18B20 digital temperature sensors,
#          and an SSR relay output for the RIMS heater.
#
# Sensors:
#   NTC1-RIMS-RAW   — ADS1115 A0 — RIMS outlet temperature (raw)
#   NTC2-MASH-RAW   — ADS1115 A1 — Mash tun temperature (raw)
#   DS18B20-Boil-RAW — 1-Wire GPIO 48 — Boil kettle (ROM: 0x750000105cbe3528)
#   DS18B20-HLT-RAW  — 1-Wire GPIO 48 — Hot Liquor Tank (ROM: 0x3100000c31dd5a28)
#
# Corrected sensors (with offset applied) are defined in singularity_templates.yaml on the Pi.
#
# Outputs:
#   SSR1 Spare          — GPIO 41 — spare SSR relay output
#   SSR2 RIMS Heater    — GPIO 42 — SSR relay for RIMS heating element
#
# Note: DS18B20 ROM addresses above are specific to this hardware installation.
#       If you replace a sensor, re-run ROM discovery to get the new address.
#
# GPIO assignments (see gpio_map.md for full reference):
#   I2C  SDA → GPIO 21 | SCL → GPIO 47
#   1-Wire Data (DQ) → GPIO 48  (4.7 kΩ pull-up to 3.3 V required)
#   SSR1 Spare → GPIO 41
#   SSR2 RIMS Heater → GPIO 42
#
# Polling: all sensors 1s | build version 60s
# Filter:  NTC → Lambda + sliding avg (5) + EMA α=0.25
#          DS18B20 → EMA α=0.25
#
# Design rule: ESP32 publishes _RAW values only. All calibration offsets,
# setpoints, thresholds and control logic are configured in HA (never here).
# Reflash only when hardware changes.
#
# Target board: ESP32-S3-DevKitC-1
# ESPHome version: 2026.8.1

---

esphome:
  name: singularity
  friendly_name: singularity
  comment: "singularity brewing controller — ESP32-S3-DevKitC-1"
  project:
    name: "exoticatom.singularity"
    version: "1.8.1"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# ── Logging ────────────────────────────────────────────────────────────────────
# DEBUG level kept intentionally during hardware bring-up phase.
# Switch to INFO once all sensors are verified and stable.
logger:
  level: DEBUG

# ── API & OTA ──────────────────────────────────────────────────────────────────
# Keys are resolved from the global secrets.yaml on the HA instance.
api:
  encryption:
    key: !secret singularity_api_encryption_key
  reboot_timeout: 3min

ota:
  - platform: esphome
    password: !secret singularity_ota_password

# ── Wi-Fi ──────────────────────────────────────────────────────────────────────
# Uses singularity-specific secret keys — do NOT use the generic wifi_ssid /
# wifi_password keys, which belong to a different network.
wifi:
  ssid: !secret singularity_wifi_ssid
  password: !secret singularity_wifi_password
  ap:
    ssid: "singularity-fallback"
    password: !secret singularity_ap_password
  fast_connect: true

captive_portal:

# ── I2C Bus ────────────────────────────────────────────────────────────────────
# SDA = GPIO 21  |  SCL = GPIO 47
# Both are in the ALLOWED / SAFE range (see gpio_map.md)
i2c:
  sda: GPIO21
  scl: GPIO47
  scan: true
  id: bus_a

# ── ADS1115 — 16-bit ADC (I2C address 0x48) ───────────────────────────────────
# ADDR pin → GND → address 0x48
# Provides four single-ended channels; we use A0 (NTC1-RIMS) and A1 (NTC2-MASH)
ads1115:
  - address: 0x48
    i2c_id: bus_a
    id: ads1115_0x48
    continuous_mode: true

# ── NTC Thermistors (via ADS1115) ─────────────────────────────────────────────
# Steinhart-Hart / Beta-equation calibration constants below are typical for a
# 10 kΩ NTC (B = 3950).  Adjust per your actual sensor datasheet.
sensor:
  # --- NTC1-RIMS (Recirculating Infusion Mash System outlet temp) ---
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A0_GND'
    gain: 6.144
    name: "NTC1-RIMS-RAW"
    id: ntc1_rims
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      # Convert raw voltage to temperature using a voltage divider + NTC model.
      # V_ref = 3.3 V, R_fixed = 10 kΩ, B = 3950, R0 = 10 kΩ at T0 = 25 °C
      - lambda: |-
          float v_ref = 3.3f;
          float r_fixed = 10000.0f;
          float r_ntc = r_fixed * x / (v_ref - x);
          float beta = 3950.0f;
          float t0 = 298.15f;   // 25 °C in Kelvin
          float r0 = 10000.0f;
          float temp_k = 1.0f / (1.0f/t0 + (1.0f/beta) * log(r_ntc / r0));
          return temp_k - 273.15f;
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # --- NTC2-MASH (Mash tun temperature) ---
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A1_GND'
    gain: 6.144
    name: "NTC2-MASH-RAW"
    id: ntc2_mash
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - lambda: |-
          float v_ref = 3.3f;
          float r_fixed = 10000.0f;
          float r_ntc = r_fixed * x / (v_ref - x);
          float beta = 3950.0f;
          float t0 = 298.15f;
          float r0 = 10000.0f;
          float temp_k = 1.0f / (1.0f/t0 + (1.0f/beta) * log(r_ntc / r0));
          return temp_k - 273.15f;
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # --- DS18B20 — 1-Wire digital temperature sensor (Kettle) ---
  # Pin GPIO 48 (ALLOWED / SAFE — see gpio_map.md)
  # Requires a 4.7 kΩ pull-up resistor between GPIO 48 and 3.3 V
  - platform: dallas_temp
    address: 0x750000105cbe3528
    name: "DS18B20-Boil-RAW"
    id: ds18b20_kettle
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # --- DS18B20 — 1-Wire digital temperature sensor (HLT) ---
  - platform: dallas_temp
    address: 0x3100000c31dd5a28
    name: "DS18B20-HLT-RAW"
    id: ds18b20_hlt
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # --- Uptime — connectivity indicator ----------------------------------------
  # Goes unavailable after ~2-3 min when ESP32 disconnects (HA internal timeout).
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    update_interval: 5s

# ── Connectivity Status ───────────────────────────────────────────────────────
# Reports ESP32 API connection state to HA independently of any sensor.
# binary_sensor.singularity_esp32_status: on = connected, off = offline
binary_sensor:
  - platform: status
    name: "ESP32 Status"
    id: esp32_status

# ── SSR Relay Outputs ─────────────────────────────────────────────────────────
# SSR1 Spare    — GPIO 41 — spare relay output
# SSR2 RIMS Heater — GPIO 42 — controls RIMS heating element
# Both default to OFF on boot for safety (restore_mode: ALWAYS_OFF)
switch:
  - platform: gpio
    pin: GPIO41
    name: "SSR1 Spare"
    id: ssr1_spare
    icon: "mdi:electric-switch"
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO42
    name: "SSR2 RIMS Heater"
    id: ssr2_rims_heater
    icon: "mdi:fire"
    restore_mode: ALWAYS_OFF

# ── Dallas (1-Wire) Bus ────────────────────────────────────────────────────────
# Data line on GPIO 48 — 4.7 kΩ pull-up to 3.3 V required on PCB/breadboard
one_wire:
  - platform: gpio
    pin: GPIO48

# ── Build Version Text Sensor ─────────────────────────────────────────────────
text_sensor:
  - platform: template
    name: "Build"
    id: firmware_version
    icon: "mdi:tag-outline"
    lambda: |-
      return {"v1.8.1"};
    update_interval: 10s
