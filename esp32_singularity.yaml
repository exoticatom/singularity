# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  esp32_singularity.yaml                                                      ║
# ║  singularity Brewing Controller — ESP32-S3-N16R8                             ║
# ║  Firmware v1.1.7                                                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
# WHAT THIS FILE IS:
#   This is the ESPHome firmware configuration for the singularity brewing
#   controller. ESPHome reads this YAML file and compiles it into C++ firmware
#   that runs directly on the ESP32 microcontroller.
#
#   You do NOT need to write C++ — ESPHome handles it. You just describe what
#   hardware is connected and what you want it to do.
#
# WHAT THE ESP32 DOES:
#   • Reads 4 temperature sensors (2× NTC thermistors, 2× DS18B20 digital)
#   • Reads 2 flow meters (SM6004 via 4-20mA converter → ADS1115 ADC)
#   • Runs a PID control loop to heat wort via a RIMS heating element (SSR)
#   • Publishes all readings to Home Assistant over WiFi
#   • Stores calibration and settings in flash memory — survives power cuts
#
# HARDWARE CONNECTED:
#   GPIO 21 (SDA) + GPIO 47 (SCL) → I2C bus → ADS1115 ADC chip
#   GPIO 48                        → 1-Wire bus → 2× DS18B20 temperature sensors
#   GPIO 41                        → SSR1 relay output (spare)
#   GPIO 42                        → SSR2 relay output (RIMS heater, PWM)
#
# ADS1115 CHANNEL MAP (16-bit ADC, address 0x48):
#   A0 → NTC1-RIMS  (temperature of wort coming out of RIMS tube)
#   A1 → NTC2-MASH  (temperature of wort in the mash tun)
#   A2 → AN1        (RIMS recirculation flow rate — SM6004 #1)
#   A3 → AN2        (Sparge flow rate — SM6004 #2)
#
# HOW SETTINGS WORK:
#   All calibration values (NTC coefficients, offsets, PID tuning) are stored
#   as "number" entities in Home Assistant. When you change a value in the HA
#   dashboard, it is sent to the ESP32 and saved to flash immediately.
#   No reflash needed — ever.
#
# HA ENTITY ID CONVENTION:
#   ESPHome generates entity IDs automatically from the device name and entity name:
#   Format:  <platform>.<device_name>_<entity_name_lowercase_underscored>
#   Example: name: "NTC1-RIMS" on device "singularity" → sensor.singularity_ntc1_rims
#
#   Every entity in this file has its HA entity ID noted as:  # → entity.id
#   on the same line as the name: field.
#
# TEMPLATE SENSOR (defined in singularity_templates/singularity_templates.yaml):
#   binary_sensor.singularity_esp32_fast_status  — fast offline detection (10s)
#   reads: sensor.singularity_uptime — if not updated for >10s → offline
#
# Target board: ESP32-S3-N16R8 (16MB flash, 8MB PSRAM)
# ESPHome version: 2026.8.1

---

# ══════════════════════════════════════════════════════════════════════════════
# GLOBALS — Variables that live in RAM while the ESP32 is running
# ══════════════════════════════════════════════════════════════════════════════
#
# These are like "global variables" in programming — values stored in RAM that
# all parts of the firmware can read and write.
#
# IMPORTANT: These are NOT saved to flash. They reset to 0 every time the
# ESP32 reboots. This is intentional for flow totals (they are per-brew-session)
# and for PID state (a clean start after every reboot is safer).
#
globals:

  # PID controller internal state — updated every 2 seconds
  # pid_integral: accumulates error over time (I term)
  # pid_last_error: remembers the previous error to calculate rate of change (D term)
  # No HA entity — internal RAM only. Used by the 2s interval PID loop.
  - id: pid_integral
    type: float
    initial_value: '0.0'
  - id: pid_last_error
    type: float
    initial_value: '0.0'

  # Flow totals — accumulated volume in litres since last reset
  # AN1 = RIMS recirculation circuit (how much wort has circulated)
  # AN2 = Sparge circuit (how many litres of sparge water transferred)
  # No HA entity — fed into sensor.singularity_an1_total / an2_total via template sensors below.
  - id: an1_total_litres
    type: float
    initial_value: '0.0'
  - id: an2_total_litres
    type: float
    initial_value: '0.0'

  # Sensor-staleness watchdog — millis() timestamp of the last ntc1_rims update.
  # Stamped by the ntc1_rims on_value trigger every time the ADS1115 delivers a
  # fresh reading. If I2C wedges, the sensor keeps its LAST value forever (it does
  # not go NAN), which would defeat the NAN + 90°C guards. The PID loop compares
  # (millis() - this) against a timeout to catch a frozen sensor. restore_value
  # false — a boot timestamp is meaningless. Initial 0 is safe: millis() is also
  # near 0 at boot, so the difference stays under the timeout until the first 1s
  # ADS1115 read stamps it.
  - id: ntc1_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'


# ══════════════════════════════════════════════════════════════════════════════
# ESPHOME — Basic device identity
# ══════════════════════════════════════════════════════════════════════════════
#
# This section defines who this device is. The "name" becomes the hostname
# on your network (singularity.local) and the prefix for all entity IDs in HA
# (e.g. sensor.singularity_ntc1_rims).
#
esphome:
  name: singularity
  friendly_name: singularity
  comment: "singularity brewing controller — ESP32-S3-N16R8"
  project:
    name: "exoticatom.singularity"
    version: "1.1.7"

  # on_boot: runs once after the ESP32 finishes booting
  # priority: -100 means it runs after all hardware is initialised
  # We use it to print all current flash values to the log so you can verify
  # what settings are active without opening HA
  on_boot:
    priority: -100
    then:
      - lambda: |-
          ESP_LOGI("singularity", "=== BOOT — Active Parameters (from flash) ===");
          ESP_LOGI("singularity", "NTC1-RIMS: R=%.0f Ω  V-ref=%.2fV  A=%.9f  B=%.9f  C=%.12f  Offset=%.1f°C",
            id(ntc1_r_fixed).state, id(ntc1_v_ref).state,
            id(ntc1_sh_a).state, id(ntc1_sh_b).state, id(ntc1_sh_c).state,
            id(ntc1_offset).state);
          ESP_LOGI("singularity", "NTC2-MASH: R=%.0f Ω  V-ref=%.2fV  A=%.9f  B=%.9f  C=%.12f  Offset=%.1f°C",
            id(ntc2_r_fixed).state, id(ntc2_v_ref).state,
            id(ntc2_sh_a).state, id(ntc2_sh_b).state, id(ntc2_sh_c).state,
            id(ntc2_offset).state);
          ESP_LOGI("singularity", "DS18B20-Boil: Offset=%.1f°C", id(ds18b20_boil_offset).state);
          ESP_LOGI("singularity", "DS18B20-HLT:  Offset=%.1f°C", id(ds18b20_hlt_offset).state);
          ESP_LOGI("singularity", "PID: Setpoint=%.1f°C  Kp=%.2f  Ki=%.4f  Kd=%.2f  MaxDuty=%.0f%%",
            id(pid_setpoint).state, id(pid_kp).state, id(pid_ki).state,
            id(pid_kd).state, id(pid_duty_cycle).state);
          ESP_LOGI("singularity", "RIMS Heater: %s", id(rims_heater).state ? "ON" : "OFF");
          ESP_LOGI("singularity", "SSR1: %s", id(ssr1).state ? "ON" : "OFF");
          ESP_LOGI("singularity", "AN1 Flow Offset: %.2f L/min", id(an1_flow_offset).state);
          ESP_LOGI("singularity", "AN2 Flow Offset: %.2f L/min", id(an2_flow_offset).state);
          ESP_LOGI("singularity", "=============================================");


# ══════════════════════════════════════════════════════════════════════════════
# ESP32 BOARD — Which chip and framework to use
# ══════════════════════════════════════════════════════════════════════════════
#
# board: esp32-s3-devkitc-1 is the standard identifier for ESP32-S3 boards
# framework: arduino — use the Arduino framework (simpler, well supported)
# variant: esp32s3 — tells ESPHome this is the S3 variant (needed for 16MB flash)
#
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino
  variant: esp32s3


# ══════════════════════════════════════════════════════════════════════════════
# LOGGER — Controls what gets printed to the serial console
# ══════════════════════════════════════════════════════════════════════════════
#
# INFO level shows important events (boot, safety triggers, PID output).
# Use DEBUG for troubleshooting — much more verbose.
# Connect USB and run "esphome logs esp32_singularity.yaml" to see the output.
#
logger:
  level: INFO


# ══════════════════════════════════════════════════════════════════════════════
# API — Connection to Home Assistant
# ══════════════════════════════════════════════════════════════════════════════
#
# The ESPHome native API lets HA talk directly to the ESP32 over WiFi.
# The encryption key prevents anyone else on the network from connecting.
# reboot_timeout: 0s — NEVER reboot just because HA is unreachable.
# Autonomy principle: an HA outage must never stop or degrade a brew in progress.
# The API timer fires precisely when HA is gone, so any non-zero value would reboot
# the controller mid-brew (dropping the heater and resetting the PID integral).
# WiFi self-healing is handled separately by the wifi: reboot_timeout (default 15min).
#
api:
  encryption:
    key: !secret singularity_api_encryption_key
  reboot_timeout: 0s


# ══════════════════════════════════════════════════════════════════════════════
# OTA — Over-The-Air firmware updates
# ══════════════════════════════════════════════════════════════════════════════
#
# OTA lets you flash new firmware over WiFi — no USB cable needed after the
# first flash. Run "esphome run esp32_singularity.yaml" and choose "Wirelessly".
#
ota:
  - platform: esphome
    password: !secret singularity_ota_password


# ══════════════════════════════════════════════════════════════════════════════
# WI-FI — Network connection
# ══════════════════════════════════════════════════════════════════════════════
#
# Credentials are stored in secrets.yaml — never hardcoded here.
# ap (access point): if WiFi fails, the ESP32 creates its own hotspot named
# "singularity-fallback" so you can still connect and fix things.
# fast_connect: skip scanning for the network — connect directly (faster).
#
wifi:
  ssid: !secret singularity_wifi_ssid
  password: !secret singularity_wifi_password
  ap:
    ssid: "singularity-fallback"
    password: !secret singularity_ap_password
  fast_connect: true

# captive_portal: when connected to the fallback hotspot, a browser popup
# appears automatically to help you configure WiFi settings.
captive_portal:


# ══════════════════════════════════════════════════════════════════════════════
# I2C BUS — Communication protocol for the ADS1115 ADC chip
# ══════════════════════════════════════════════════════════════════════════════
#
# I2C is a 2-wire communication protocol. Multiple chips can share the same
# two wires (SDA = data, SCL = clock). Each chip has a unique address (0x48).
# scan: true — at boot, the ESP32 scans and logs all I2C devices found.
# This is useful to verify wiring — you should see 0x48 in the boot log.
#
i2c:
  sda: GPIO21
  scl: GPIO47
  scan: true
  id: bus_a


# ══════════════════════════════════════════════════════════════════════════════
# ADS1115 — 16-bit Analog-to-Digital Converter
# ══════════════════════════════════════════════════════════════════════════════
#
# The ESP32 has a built-in ADC but it's noisy and inaccurate (~12-bit).
# The ADS1115 is a dedicated 16-bit ADC chip on the I2C bus — much more
# accurate. It has 4 input channels (A0–A3).
#
# address: 0x48 — the chip's I2C address (set by the ADDR pin → GND)
# continuous_mode: false — single-shot mode. The chip takes one reading when
# asked, then goes idle. This reduces noise compared to continuous sampling.
#
ads1115:
  - address: 0x48
    i2c_id: bus_a
    id: ads1115_0x48
    continuous_mode: false


# ══════════════════════════════════════════════════════════════════════════════
# NUMBER ENTITIES — Adjustable parameters stored on flash
# ══════════════════════════════════════════════════════════════════════════════
#
# Each "number" entity creates a value in Home Assistant that you can adjust
# from the Settings tab. When you change a value, it is:
#   1. Sent to the ESP32 via the API
#   2. Saved to flash (restore_value: true) — survives reboots forever
#   3. Used immediately by the firmware (no reflash needed)
#
# "optimistic: true" means HA doesn't wait for the ESP32 to confirm —
# it updates the UI immediately. This makes the dashboard feel responsive.
#
number:

  # ─────────────────────────────────────────────────────────────────────────
  # NTC1-RIMS CALIBRATION PARAMETERS
  # ─────────────────────────────────────────────────────────────────────────
  #
  # NTC thermistors change resistance with temperature. To convert resistance
  # to °C we use the Steinhart-Hart equation:
  #   1/T = A + B·ln(R) + C·(ln(R))³
  # where T is temperature in Kelvin, R is the thermistor resistance in Ohms.
  #
  # R is calculated from the measured voltage using a voltage divider:
  #   R = R_fixed × V / (V_ref − V)
  #
  # These 5 parameters (R_fixed, V_ref, A, B, C) are specific to YOUR physical
  # thermistor and were determined by the calibration procedure.
  # See hardware/calibration.md for the step-by-step calibration process.

  - platform: template
    name: "NTC1 R-Fixed"          # → number.singularity_ntc1_r_fixed
    id: ntc1_r_fixed
    # The actual measured resistance of the fixed 10kΩ resistor in the voltage divider.
    # Measure with a multimeter before soldering — never use the nominal value.
    min_value: 1000
    max_value: 20000
    step: 1
    restore_value: true
    initial_value: 9883       # measured value for this installation
    optimistic: true
    unit_of_measurement: "Ω"
    icon: "mdi:resistor"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 R-Fixed: %.0f Ohm", x);

  - platform: template
    name: "NTC1 V-Ref"             # → number.singularity_ntc1_v_ref
    id: ntc1_v_ref
    # The reference voltage powering the voltage divider.
    # Should be 3.3V for ESP32. Measure with a multimeter for accuracy.
    min_value: 1.0
    max_value: 5.0
    step: 0.01
    restore_value: true
    initial_value: 3.3
    optimistic: true
    unit_of_measurement: "V"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 V-Ref: %.2f V", x);

  - platform: template
    name: "NTC1 SH-A"              # → number.singularity_ntc1_sh_a
    id: ntc1_sh_a
    # Steinhart-Hart coefficient A — calculated from 3-point calibration
    min_value: 0
    max_value: 0.01
    step: 0.000000001
    restore_value: true
    initial_value: 0.001207071588
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 SH-A: %.9f", x);

  - platform: template
    name: "NTC1 SH-B"              # → number.singularity_ntc1_sh_b
    id: ntc1_sh_b
    # Steinhart-Hart coefficient B — calculated from 3-point calibration
    min_value: 0
    max_value: 0.01
    step: 0.000000001
    restore_value: true
    initial_value: 0.0002183328996
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 SH-B: %.9f", x);

  - platform: template
    name: "NTC1 SH-C"              # → number.singularity_ntc1_sh_c
    id: ntc1_sh_c
    # Steinhart-Hart coefficient C — calculated from 3-point calibration
    min_value: 0
    max_value: 0.001
    step: 0.000000001
    restore_value: true
    initial_value: 0.0000001764463641
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 SH-C: %.12f", x);

  - platform: template
    name: "NTC1 Offset"            # → number.singularity_ntc1_offset
    id: ntc1_offset
    # Single-point fine-tune offset applied AFTER the S-H calculation.
    # If the sensor reads 0.3°C too high, set offset to -0.3.
    # Useful for small adjustments without full recalibration.
    min_value: -10
    max_value: 10
    step: 0.1
    restore_value: true
    initial_value: 0.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-plus"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC1 Offset: %.1f degC", x);

  # ─────────────────────────────────────────────────────────────────────────
  # NTC2-MASH CALIBRATION PARAMETERS
  # ─────────────────────────────────────────────────────────────────────────
  # Same structure as NTC1. These are calibrated for the mash tun sensor.

  - platform: template
    name: "NTC2 R-Fixed"          # → number.singularity_ntc2_r_fixed
    id: ntc2_r_fixed
    min_value: 1000
    max_value: 20000
    step: 1
    restore_value: true
    initial_value: 9902
    optimistic: true
    unit_of_measurement: "Ω"
    icon: "mdi:resistor"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 R-Fixed: %.0f Ohm", x);

  - platform: template
    name: "NTC2 V-Ref"             # → number.singularity_ntc2_v_ref
    id: ntc2_v_ref
    min_value: 1.0
    max_value: 5.0
    step: 0.01
    restore_value: true
    initial_value: 3.3
    optimistic: true
    unit_of_measurement: "V"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 V-Ref: %.2f V", x);

  - platform: template
    name: "NTC2 SH-A"              # → number.singularity_ntc2_sh_a
    id: ntc2_sh_a
    min_value: 0
    max_value: 0.01
    step: 0.000000001
    restore_value: true
    initial_value: 0.001209771862
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 SH-A: %.9f", x);

  - platform: template
    name: "NTC2 SH-B"              # → number.singularity_ntc2_sh_b
    id: ntc2_sh_b
    min_value: 0
    max_value: 0.01
    step: 0.000000001
    restore_value: true
    initial_value: 0.0002173461562
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 SH-B: %.9f", x);

  - platform: template
    name: "NTC2 SH-C"              # → number.singularity_ntc2_sh_c
    id: ntc2_sh_c
    min_value: 0
    max_value: 0.001
    step: 0.000000001
    restore_value: true
    initial_value: 0.0000001848376283
    optimistic: true
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 SH-C: %.12f", x);

  - platform: template
    name: "NTC2 Offset"            # → number.singularity_ntc2_offset
    id: ntc2_offset
    min_value: -10
    max_value: 10
    step: 0.1
    restore_value: true
    initial_value: 0.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-plus"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — NTC2 Offset: %.1f degC", x);

  # ─────────────────────────────────────────────────────────────────────────
  # DS18B20 OFFSET CORRECTION
  # ─────────────────────────────────────────────────────────────────────────
  #
  # DS18B20 sensors are factory-calibrated (±0.5°C accuracy).
  # A simple single-point offset is usually enough to correct any small error.
  # Procedure: compare DS18B20 reading against a reference thermometer at
  # your typical mash temperature. offset = reference − DS18B20 reading.

  - platform: template
    name: "DS18B20-Boil Offset"   # → number.singularity_ds18b20_boil_offset
    id: ds18b20_boil_offset
    min_value: -10
    max_value: 10
    step: 0.1
    restore_value: true
    initial_value: 0.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-plus"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — DS18B20-Boil Offset: %.1f degC", x);

  - platform: template
    name: "DS18B20-HLT Offset"    # → number.singularity_ds18b20_hlt_offset
    id: ds18b20_hlt_offset
    min_value: -10
    max_value: 10
    step: 0.1
    restore_value: true
    initial_value: 0.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-plus"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — DS18B20-HLT Offset: %.1f degC", x);

  # ─────────────────────────────────────────────────────────────────────────
  # PID CONTROL PARAMETERS
  # ─────────────────────────────────────────────────────────────────────────
  #
  # PID (Proportional-Integral-Derivative) is a control algorithm that drives
  # the heater to reach and hold a target temperature.
  #
  # HOW IT WORKS (simplified):
  #   error = target_temp - current_temp
  #   output = Kp × error               ← proportional: reacts to current error
  #           + Ki × (sum of past errors) ← integral: fixes steady-state offset
  #           + Kd × (rate of error change) ← derivative: dampens oscillations
  #
  # TUNING GUIDE:
  #   Start: Kp=10, Ki=0, Kd=0, MaxDuty=100%
  #   → If temperature overshoots setpoint:  reduce Kp
  #   → If temperature never quite reaches setpoint: increase Ki
  #   → If temperature oscillates around setpoint: increase Kd
  #
  # The PID runs every 2 seconds (dt=2s) and drives GPIO42 via slow_pwm.

  - platform: template
    name: "PID Setpoint"           # → number.singularity_pid_setpoint
    id: pid_setpoint
    # Target temperature in °C. Max 78°C — safe upper limit for mash brewing.
    min_value: 0
    max_value: 78
    step: 0.5
    restore_value: true
    initial_value: 66.0
    optimistic: true
    unit_of_measurement: "°C"
    icon: "mdi:target"
    mode: box        # renders as a text input box in HA instead of a slider
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Setpoint: %.1f degC", x);

  - platform: template
    name: "PID Kp"                 # → number.singularity_pid_kp
    id: pid_kp
    # Proportional gain — larger value = stronger reaction to temperature error.
    # Too high → overshoot. Too low → slow response.
    min_value: 0
    max_value: 100
    step: 0.01
    restore_value: true
    initial_value: 10.0
    optimistic: true
    icon: "mdi:alpha-p-circle"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Kp: %.2f", x);

  - platform: template
    name: "PID Ki"                 # → number.singularity_pid_ki
    id: pid_ki
    # Integral gain — corrects persistent offset below setpoint.
    # Keep low (0.1–0.5). Set to 0 during initial tuning.
    min_value: 0
    max_value: 10
    step: 0.001
    restore_value: true
    initial_value: 0.2
    optimistic: true
    icon: "mdi:alpha-i-circle"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Ki: %.4f", x);

  - platform: template
    name: "PID Kd"                 # → number.singularity_pid_kd
    id: pid_kd
    # Derivative gain — dampens oscillations by reacting to rate of change.
    # Helps prevent overshoot. Set to 0 during initial tuning.
    min_value: 0
    max_value: 100
    step: 0.01
    restore_value: true
    initial_value: 5.0
    optimistic: true
    icon: "mdi:alpha-d-circle"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Kd: %.2f", x);

  - platform: template
    name: "PID Max Duty Cycle"    # → number.singularity_pid_max_duty_cycle
    id: pid_duty_cycle
    # Hard cap on heater output as a percentage (0–100%).
    # Setting to 80% protects the heating element from overheating.
    # At 100% the PID has full control.
    min_value: 0
    max_value: 100
    step: 1
    restore_value: true
    initial_value: 100
    optimistic: true
    unit_of_measurement: "%"
    icon: "mdi:percent"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Max Duty Cycle: %.0f%%", x);

  # ─────────────────────────────────────────────────────────────────────────
  # FLOW SENSOR OFFSETS — AN1 (RIMS) and AN2 (Sparge)
  # ─────────────────────────────────────────────────────────────────────────
  #
  # After the 4-20mA converter is calibrated with ZERO and SPAN pots,
  # there may still be a small difference between what the SM6004 display
  # shows and what the ADS1115 reads (due to input impedance loading).
  # Set offset = SM6004_display_reading − ESP32_HA_reading at steady flow.
  # Example: SM6004 shows 8.3 L/min, HA shows 7.9 → set offset to +0.4

  - platform: template
    name: "AN1 Flow Offset"        # → number.singularity_an1_flow_offset
    id: an1_flow_offset
    min_value: -5.0
    max_value: 5.0
    step: 0.05
    restore_value: true
    initial_value: 0.0
    optimistic: true
    unit_of_measurement: "L/min"
    icon: "mdi:tune"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — AN1 Flow Offset: %.2f L/min", x);

  - platform: template
    name: "AN2 Flow Offset"        # → number.singularity_an2_flow_offset
    id: an2_flow_offset
    min_value: -5.0
    max_value: 5.0
    step: 0.05
    restore_value: true
    initial_value: 0.0
    optimistic: true
    unit_of_measurement: "L/min"
    icon: "mdi:tune"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — AN2 Flow Offset: %.2f L/min", x);

  # ─────────────────────────────────────────────────────────────────────────
  # PID MIN FLOW — RIMS dry-fire / scorch protection threshold
  # ─────────────────────────────────────────────────────────────────────────
  # Minimum RIMS recirculation flow (an1_rate) required for the heater to fire.
  # Only enforced when switch.singularity_flow_interlock_enable is ON.
  # Leave the interlock OFF until the AN1 flow meter is commissioned against
  # the SM6004 display, then turn it ON before the first RIMS load test.
  - platform: template
    name: "PID Min Flow"           # → number.singularity_pid_min_flow
    id: pid_min_flow
    min_value: 0.0
    max_value: 20.0
    step: 0.5
    restore_value: true
    initial_value: 2.0
    optimistic: true
    unit_of_measurement: "L/min"
    icon: "mdi:water-alert"
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("singularity", "FLASH SAVED — PID Min Flow: %.2f L/min", x);


# ══════════════════════════════════════════════════════════════════════════════
# SENSORS — Everything the ESP32 reads and publishes to HA
# ══════════════════════════════════════════════════════════════════════════════

sensor:

  # ─────────────────────────────────────────────────────────────────────────
  # UPTIME — counts seconds since last boot
  # ─────────────────────────────────────────────────────────────────────────
  # This is not displayed on the dashboard but is used by the HA template
  # sensor (binary_sensor.singularity_esp32_fast_status) to detect if the ESP32 is online.
  # If this value stops updating for 10 seconds, HA shows the offline banner.
  - platform: uptime
    name: "Uptime"                 # → sensor.singularity_uptime
    id: singularity_uptime
    update_interval: 1s

  # ─────────────────────────────────────────────────────────────────────────
  # WiFi SIGNAL STRENGTH — diagnostic only
  # ─────────────────────────────────────────────────────────────────────────
  # Shown as an attribute of the fast-status sensor. Not recorded in HA DB.
  - platform: wifi_signal
    name: "WiFi Signal"            # → sensor.singularity_wifi_signal
    id: wifi_signal_strength
    update_interval: 60s

  # ─────────────────────────────────────────────────────────────────────────
  # NTC1-RIMS — RIMS tube outlet temperature (ADS1115 A0)
  # ─────────────────────────────────────────────────────────────────────────
  #
  # How it works:
  #   1. ADS1115 reads the voltage at the midpoint of the voltage divider
  #   2. Lambda filter converts voltage → resistance → °C using Steinhart-Hart
  #   3. EMA (Exponential Moving Average) smooths out noise
  #
  # The lambda filter returns NAN (Not A Number) if the sensor is disconnected
  # or reading something impossible. NAN causes the PID to shut off the heater
  # automatically — this is a safety feature.
  #
  # gain: 6.144 means the ADS1115 measures in the ±6.144V range
  # multiplexer: A0_GND means channel A0 referenced to ground (single-ended)
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A0_GND'
    gain: 6.144
    name: "NTC1-RIMS"              # → sensor.singularity_ntc1_rims
    id: ntc1_rims
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - lambda: |-
          float v = x;                           // voltage from ADS1115
          float v_ref = id(ntc1_v_ref).state;    // reference voltage (3.3V)
          float r_fixed = id(ntc1_r_fixed).state; // fixed resistor value
          float a = id(ntc1_sh_a).state;          // S-H coefficient A
          float b = id(ntc1_sh_b).state;          // S-H coefficient B
          float c = id(ntc1_sh_c).state;          // S-H coefficient C
          float offset = id(ntc1_offset).state;   // fine-tune offset

          // Safety: reject voltages that can't be a real NTC reading
          // Floating (disconnected) inputs settle around 0.58V on this hardware
          // Valid NTC range starts ~0.9V (at 5°C). 0.7V gives safe margin.
          if (v < 0.7f || v >= v_ref) return NAN;

          // Calculate thermistor resistance from voltage divider formula
          float r = r_fixed * v / (v_ref - v);
          if (r <= 0) return NAN;

          // Steinhart-Hart equation: converts resistance to temperature in Kelvin
          float lnr = log(r);
          float inv_t = a + b * lnr + c * pow(lnr, 3);
          float temp = (1.0f / inv_t) - 273.15f + offset;  // Kelvin → Celsius + offset

          // Safety: reject temperatures outside the physical brewing range
          if (temp < 0 || temp > 100) return NAN;
          return temp;

      # EMA filter: smooths readings — α=0.25 means each new reading
      # contributes 25% to the output, previous output contributes 75%.
      # Lower α = smoother but slower response to real temperature changes.
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1
    # Staleness watchdog: stamp the time of every fresh reading. The PID loop
    # uses this to detect a frozen sensor (I2C wedged) that keeps its last value
    # instead of going NAN. See SAFETY CHECK 0 in the 2s PID loop.
    on_value:
      - lambda: 'id(ntc1_last_update_ms) = millis();'

  # ─────────────────────────────────────────────────────────────────────────
  # NTC2-MASH — Mash tun temperature (ADS1115 A1)
  # ─────────────────────────────────────────────────────────────────────────
  # Identical circuit and calculation to NTC1, different calibration values.
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A1_GND'
    gain: 6.144
    name: "NTC2-MASH"              # → sensor.singularity_ntc2_mash
    id: ntc2_mash
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - lambda: |-
          float v = x;
          float v_ref = id(ntc2_v_ref).state;
          float r_fixed = id(ntc2_r_fixed).state;
          float a = id(ntc2_sh_a).state;
          float b = id(ntc2_sh_b).state;
          float c = id(ntc2_sh_c).state;
          float offset = id(ntc2_offset).state;
          if (v < 0.7f || v >= v_ref) return NAN;
          float r = r_fixed * v / (v_ref - v);
          if (r <= 0) return NAN;
          float lnr = log(r);
          float inv_t = a + b * lnr + c * pow(lnr, 3);
          float temp = (1.0f / inv_t) - 273.15f + offset;
          if (temp < 0 || temp > 100) return NAN;
          return temp;
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # ─────────────────────────────────────────────────────────────────────────
  # DS18B20-Boil — Boil kettle temperature (1-Wire GPIO48)
  # ─────────────────────────────────────────────────────────────────────────
  #
  # DS18B20 is a digital temperature sensor — it outputs °C directly over
  # the 1-Wire protocol. No voltage conversion needed.
  # address: the unique 64-bit ROM code of this specific sensor.
  #          If you replace the sensor, run ROM discovery to find the new address.
  # The offset is added after reading — adjustable from HA Settings without reflash.
  - platform: dallas_temp
    address: 0x750000105cbe3528
    name: "DS18B20-Boil"           # → sensor.singularity_ds18b20_boil
    id: ds18b20_boil
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - lambda: |-
          float offset = id(ds18b20_boil_offset).state;
          return x + offset;
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # ─────────────────────────────────────────────────────────────────────────
  # DS18B20-HLT — Hot Liquor Tank temperature (1-Wire GPIO48)
  # ─────────────────────────────────────────────────────────────────────────
  # Both DS18B20 sensors share the same wire (GPIO48) — 1-Wire supports
  # multiple devices on one pin, identified by their unique ROM address.
  - platform: dallas_temp
    address: 0x3100000c31dd5a28
    name: "DS18B20-HLT"            # → sensor.singularity_ds18b20_hlt
    id: ds18b20_hlt
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    filters:
      - lambda: |-
          float offset = id(ds18b20_hlt_offset).state;
          return x + offset;
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # ─────────────────────────────────────────────────────────────────────────
  # AN1 — RIMS FLOW SENSOR (SM6004 #1 → XY-IT0V converter → ADS1115 A2)
  # ─────────────────────────────────────────────────────────────────────────
  #
  # The SM6004 flow meter outputs a 4-20mA current signal proportional to flow.
  # The XY-IT0V module converts this to 0-3.3V for the ADS1115 to read.
  # Calibration: 0V = 0 L/min, 1.743V = 13.20 L/min → slope = 7.57 L/min per volt
  #
  # Raw voltage sensor: shows the ADS1115 voltage before any conversion.
  # Useful for diagnosing noise issues or recalibrating the slope.
  # Median filter: takes 5 readings and returns the middle value — rejects spikes.

  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A2_GND'
    gain: 6.144
    name: "AN1 Raw Voltage"        # → sensor.singularity_an1_raw_voltage
    id: an1_raw_voltage
    unit_of_measurement: "V"
    icon: "mdi:sine-wave"
    state_class: measurement
    update_interval: 1s
    filters:
      - median:
          window_size: 5    # take 5 readings, return the middle one (rejects noise spikes)
          send_every: 1
          send_first_at: 1
      - exponential_moving_average:
          alpha: 0.25       # REQUIRED per architecture rules: all analog inputs including diagnostics must use EMA α=0.25

  # AN1 flow rate — converts voltage to L/min using calibrated slope
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A2_GND'
    gain: 6.144
    name: "AN1 Rate"               # → sensor.singularity_an1_rate
    id: an1_rate
    unit_of_measurement: "L/min"
    icon: "mdi:water-pump"
    state_class: measurement
    update_interval: 1s
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - lambda: |-
          // Reject near-zero voltages (noise at standstill, disconnected input)
          if (x < 0.01f) return 0.0f;
          // Convert voltage to L/min: slope × voltage + offset
          // slope = 7.57 L/min per volt (calibrated with SM6004 at 13.20 L/min)
          float rate = (x * 7.57f) + id(an1_flow_offset).state;
          if (rate < 0.0f) rate = 0.0f;  // clamp to zero — never negative
          return rate;
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  # AN1 flow SAFETY voltage — fast, near-raw read of A2 for the flow interlock.
  # internal: true → not exposed to HA; this is a control signal, not a display.
  # WHY separate from an1_rate: an1_rate carries median(5)+EMA(0.25) for a stable
  # display, which adds ~4-5s of lag — too slow to catch a sudden flow loss before
  # a RIMS element scorches. This sensor uses only a median(3) spike-reject and NO
  # EMA, so the interlock sees a real flow drop within ~2s. The median(3) is
  # deliberate: it blocks a lone HIGH noise spike from falsely permitting heat
  # (the dangerous direction); a lone LOW spike only trips the heater OFF for one
  # cycle, which is fail-safe. EMA is intentionally omitted here — it would
  # reintroduce the lag this sensor exists to avoid.
  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A2_GND'
    gain: 6.144
    id: an1_flow_safety_v
    internal: true
    update_interval: 1s
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1

  # AN1 total — running litre count since last reset
  # This is a template sensor that reads the global variable an1_total_litres.
  # The actual accumulation happens in the 1s interval loop below.
  - platform: template
    name: "AN1 Total"              # → sensor.singularity_an1_total
    id: an1_total
    unit_of_measurement: "L"
    icon: "mdi:water"
    state_class: total_increasing
    lambda: |-
      return id(an1_total_litres);
    update_interval: 1s

  # ─────────────────────────────────────────────────────────────────────────
  # AN2 — SPARGE FLOW SENSOR (SM6004 #2 → XY-IT0V converter → ADS1115 A3)
  # ─────────────────────────────────────────────────────────────────────────
  # Same setup as AN1 but for the sparge water circuit.
  # AN2 is not yet physically connected — the 0.15V guard prevents the
  # floating ADS1115 input from being counted as real flow.

  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A3_GND'
    gain: 6.144
    name: "AN2 Raw Voltage"        # → sensor.singularity_an2_raw_voltage
    id: an2_raw_voltage
    unit_of_measurement: "V"
    icon: "mdi:sine-wave"
    state_class: measurement
    update_interval: 1s
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
      - exponential_moving_average:
          alpha: 0.25       # REQUIRED per architecture rules: all analog inputs including diagnostics must use EMA α=0.25

  - platform: ads1115
    ads1115_id: ads1115_0x48
    multiplexer: 'A3_GND'
    gain: 6.144
    name: "AN2 Rate"               # → sensor.singularity_an2_rate
    id: an2_rate
    unit_of_measurement: "L/min"
    icon: "mdi:water-pump"
    state_class: measurement
    update_interval: 1s
    filters:
      - median:                # match AN1 rate chain — spike rejection before conversion
          window_size: 5
          send_every: 1
          send_first_at: 1
      - lambda: |-
          // AN2 (A3) is not yet connected. Unconnected ADS1115 inputs float to
          // ~0.1V on this hardware, which × slope would give ~0.8 L/min false reading.
          // 0.15V threshold safely rejects float noise while accepting real flow signal.
          if (x < 0.15f) return 0.0f;
          float rate = (x * 7.57f) + id(an2_flow_offset).state;
          if (rate < 0.0f) rate = 0.0f;
          return rate;
      - exponential_moving_average:
          alpha: 0.25
          send_every: 1

  - platform: template
    name: "AN2 Total"              # → sensor.singularity_an2_total
    id: an2_total
    unit_of_measurement: "L"
    icon: "mdi:water"
    state_class: total_increasing
    lambda: |-
      return id(an2_total_litres);
    update_interval: 1s


# ══════════════════════════════════════════════════════════════════════════════
# BINARY SENSOR — ESP32 connectivity status (native ESPHome)
# ══════════════════════════════════════════════════════════════════════════════
#
# This is the built-in ESPHome connectivity sensor. It takes 30-60 seconds
# to detect a disconnection. We use it to trigger the reconnect automation in HA.
# For faster offline detection (10s), we use the template sensor in
# singularity_templates/singularity_templates.yaml instead.
#
binary_sensor:
  - platform: status
    name: "ESP32 Status"           # → binary_sensor.singularity_esp32_status
    id: esp32_status


# ══════════════════════════════════════════════════════════════════════════════
# OUTPUT — PWM signal for the RIMS heater SSR
# ══════════════════════════════════════════════════════════════════════════════
#
# slow_pwm: Pulse Width Modulation with a 2-second period.
# SSRs (Solid State Relays) cannot switch at high frequency like motor PWM —
# they need a slow cycle time that matches the AC power cycle.
# A 2s period means: at 50% duty the heater is ON for 1s, OFF for 1s.
# The PID loop writes the duty cycle (0.0 = off, 1.0 = full power) every 2s.
# GPIO42 is owned exclusively by this output — no other code should touch it.
#
output:
  - platform: slow_pwm
    pin: GPIO42
    id: rims_heater_pwm
    period: 2s


# ══════════════════════════════════════════════════════════════════════════════
# INTERVAL — Code that runs on a timer
# ══════════════════════════════════════════════════════════════════════════════

interval:

  # ─────────────────────────────────────────────────────────────────────────
  # RIMS PID CONTROL LOOP — runs every 2 seconds
  # ─────────────────────────────────────────────────────────────────────────
  #
  # This is the heart of the brewing controller. Every 2 seconds it:
  #   1. Checks if the heater switch is ON
  #   2. Reads NTC1-RIMS temperature
  #   3. Runs safety checks (sensor disconnect, over-temperature)
  #   4. Calculates PID output
  #   5. Writes duty cycle to the SSR via slow_pwm
  #
  - interval: 2s
    then:
      - lambda: |-
          const float dt = 2.0f;  // time step in seconds (matches interval)

          // If the heater switch is OFF, force output to 0% and stop here
          if (!id(rims_heater).state) {
            id(rims_heater_pwm).set_level(0.0f);
            return;
          }

          // SAFETY CHECK 0: sensor staleness — ADS1115 / I2C stopped updating.
          // If I2C wedges, ntc1_rims keeps its LAST value forever (it does not go
          // NAN), so the NAN and 90°C guards below would trust a frozen number and
          // keep heating blind. Catch it here: if no fresh ntc1_rims reading has
          // arrived for >8s (sensor updates every 1s), shut the heater off.
          // Unsigned subtraction is millis()-wrap safe.
          uint32_t stale_ms = millis() - id(ntc1_last_update_ms);
          if (stale_ms > 8000) {
            id(rims_heater_pwm).set_level(0.0f);
            ESP_LOGW("singularity", "RIMS SAFETY — ntc1_rims stale %ums, heater OFF", stale_ms);
            return;
          }

          float temp = id(ntc1_rims).state;

          // SAFETY CHECK 1: sensor disconnected or failed
          // NAN means the sensor returned an invalid reading (disconnected,
          // shorted, or outside 0-100°C range). Shut heater off immediately.
          if (std::isnan(temp)) {
            id(rims_heater_pwm).set_level(0.0f);
            ESP_LOGW("singularity", "RIMS SAFETY — ntc1_rims NAN, heater OFF");
            return;
          }

          // SAFETY CHECK 2: over-temperature hard limit
          // If temperature exceeds 90°C, something is wrong (pump failure,
          // shorted sensor reading falsely low, etc). Shut off immediately.
          if (temp > 90.0f) {
            id(rims_heater_pwm).set_level(0.0f);
            ESP_LOGW("singularity", "RIMS SAFETY — temp %.1f°C > 90°C hard limit, heater OFF", temp);
            return;
          }

          // SAFETY CHECK 3: RIMS flow interlock — dry-fire / scorch protection
          // A RIMS element heats water flowing through a tube; NTC1 is at the
          // tube OUTLET and lags the element surface. If flow stops (pump fail,
          // kinked hose, airlock) the element can scorch the wort before the
          // 90°C outlet guard reacts. Require minimum recirculation flow while
          // heating. Only enforced when the interlock is explicitly enabled —
          // keep it OFF until the AN1 flow meter is commissioned (default OFF).
          if (id(flow_interlock_enable).state) {
            // Use the fast, near-raw safety voltage (an1_flow_safety_v), NOT the
            // display-smoothed an1_rate — median(5)+EMA on an1_rate adds ~4-5s of
            // lag, too slow to catch a sudden flow loss before the element scorches.
            float sv = id(an1_flow_safety_v).state;
            float flow = std::isnan(sv) ? NAN : (sv * 7.57f) + id(an1_flow_offset).state;
            if (std::isnan(flow) || flow < id(pid_min_flow).state) {
              id(rims_heater_pwm).set_level(0.0f);
              ESP_LOGW("singularity", "RIMS SAFETY — flow %.2f L/min < %.2f min, heater OFF",
                       flow, id(pid_min_flow).state);
              return;
            }
          }

          // PID CALCULATION
          float setpoint  = id(pid_setpoint).state;
          float kp        = id(pid_kp).state;
          float ki        = id(pid_ki).state;
          float kd        = id(pid_kd).state;
          float max_duty  = id(pid_duty_cycle).state / 100.0f;  // convert % to 0.0–1.0

          // Error: how far we are from the target temperature
          float error = setpoint - temp;

          // Integral: accumulates error over time
          id(pid_integral) += error * dt;

          // Anti-windup: prevent integral from growing without limit
          // If Ki is 0, set a large clamp to avoid divide-by-zero
          float max_i = (ki > 0.0f) ? (max_duty / ki) : 1000.0f;
          if (id(pid_integral) >  max_i) id(pid_integral) =  max_i;
          if (id(pid_integral) < -max_i) id(pid_integral) = -max_i;

          // Derivative: rate of change of error
          float derivative   = (error - id(pid_last_error)) / dt;
          id(pid_last_error) = error;  // remember for next cycle

          // Final output: sum of P + I + D terms, clamped to [0, max_duty]
          float output = kp * error + ki * id(pid_integral) + kd * derivative;
          if (output < 0.0f)     output = 0.0f;       // never negative
          if (output > max_duty) output = max_duty;    // never above max

          id(rims_heater_pwm).set_level(output);

          // Log every cycle so you can watch PID behaviour in ESPHome logs
          ESP_LOGI("singularity", "RIMS PID  temp=%.2f°C  err=%.2f  I=%.4f  D=%.4f  out=%.1f%%",
                   temp, error, id(pid_integral), derivative, output * 100.0f);

  # ─────────────────────────────────────────────────────────────────────────
  # FLOW TOTAL ACCUMULATOR — runs every 1 second
  # ─────────────────────────────────────────────────────────────────────────
  #
  # Integrates flow rate into a running total:
  #   total += rate (L/min) / 60 (converts L/min to L/s) × 1s = rate/60
  #
  # The 0.05 L/min threshold prevents counting tiny noise readings as flow
  # when the pump is not running.
  #
  - interval: 1s
    then:
      - lambda: |-
          float r1 = id(an1_rate).state;
          if (!std::isnan(r1) && r1 > 0.05f) {
            id(an1_total_litres) += r1 / 60.0f;  // L/min ÷ 60 = L per second
          }
          float r2 = id(an2_rate).state;
          if (!std::isnan(r2) && r2 > 0.05f) {
            id(an2_total_litres) += r2 / 60.0f;
          }


# ══════════════════════════════════════════════════════════════════════════════
# SWITCHES — ON/OFF controls exposed to HA
# ══════════════════════════════════════════════════════════════════════════════

switch:

  # ─────────────────────────────────────────────────────────────────────────
  # SSR1 — Spare relay output (GPIO41)
  # ─────────────────────────────────────────────────────────────────────────
  # Direct GPIO switch — when ON, GPIO41 goes HIGH (3.3V), triggering the SSR.
  # RESTORE_DEFAULT_OFF: always starts OFF on first boot.
  # On subsequent reboots, restores the last known state from flash.
  - platform: gpio
    pin: GPIO41
    name: "SSR1"                   # → switch.singularity_ssr1
    id: ssr1
    icon: "mdi:electric-switch"
    restore_mode: RESTORE_DEFAULT_OFF

  # ─────────────────────────────────────────────────────────────────────────
  # RIMS HEATER — Enables/disables the PID control loop
  # ─────────────────────────────────────────────────────────────────────────
  # This is a template switch (no physical GPIO) — it controls whether the
  # PID interval loop runs or not. The actual heater output is on GPIO42
  # via the slow_pwm output (rims_heater_pwm).
  #
  # When turned ON: PID state is reset (clean start) and loop begins running.
  # When turned OFF: heater output forced to 0%, PID state reset.
  # Persisted to flash — if power cuts mid-brew, it resumes in the same state.
  - platform: template
    name: "RIMS Heater"            # → switch.singularity_rims_heater
    id: rims_heater
    icon: "mdi:fire"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      then:
        - lambda: |-
            id(pid_integral)   = 0.0f;  // reset integral — clean PID start
            id(pid_last_error) = 0.0f;  // reset derivative memory
            ESP_LOGI("singularity", "RIMS PID ON — state reset, starting control loop");
    on_turn_off:
      then:
        - lambda: |-
            id(rims_heater_pwm).set_level(0.0f);  // immediately cut heater power
            id(pid_integral)   = 0.0f;
            id(pid_last_error) = 0.0f;
            ESP_LOGI("singularity", "RIMS PID OFF — heater output 0%%");

  # ─────────────────────────────────────────────────────────────────────────
  # FLOW INTERLOCK ENABLE — arms the RIMS dry-fire / scorch protection
  # ─────────────────────────────────────────────────────────────────────────
  # When ON, the PID loop refuses to heat unless RIMS flow (an1_rate) is at or
  # above number.singularity_pid_min_flow. Fails safe: heater holds off each
  # cycle while flow is low and resumes automatically once flow returns.
  # RESTORE_DEFAULT_OFF: ships dormant. Turn ON only after the AN1 flow meter is
  # verified against the SM6004 display, and before the first RIMS load test.
  - platform: template
    name: "Flow Interlock Enable"  # → switch.singularity_flow_interlock_enable
    id: flow_interlock_enable
    icon: "mdi:water-check"
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true


# ══════════════════════════════════════════════════════════════════════════════
# BUTTONS — One-shot actions exposed to HA
# ══════════════════════════════════════════════════════════════════════════════
#
# Unlike switches, buttons have no state — pressing them fires once and that's it.
# They appear in HA as a button you can press, not a toggle.
# Use these at the start of each brew session to zero the flow totals.
#
button:

  - platform: template
    name: "AN1 Reset Total"        # → button.singularity_an1_reset_total
    id: an1_reset
    icon: "mdi:restore"
    on_press:
      - lambda: |-
          id(an1_total_litres) = 0.0f;  // zero the RIMS flow total
          ESP_LOGI("singularity", "AN1 total reset to 0.0 L");

  - platform: template
    name: "AN2 Reset Total"        # → button.singularity_an2_reset_total
    id: an2_reset
    icon: "mdi:restore"
    on_press:
      - lambda: |-
          id(an2_total_litres) = 0.0f;  // zero the Sparge flow total
          ESP_LOGI("singularity", "AN2 total reset to 0.0 L");


# ══════════════════════════════════════════════════════════════════════════════
# 1-WIRE BUS — Digital temperature sensors (DS18B20)
# ══════════════════════════════════════════════════════════════════════════════
#
# 1-Wire is a protocol that allows multiple sensors on a single wire.
# GPIO48 carries the data line. A 4.7kΩ pull-up resistor to 3.3V is required.
# Both DS18B20 sensors (Boil + HLT) share this single wire.
#
one_wire:
  - platform: gpio
    pin: GPIO48


# ══════════════════════════════════════════════════════════════════════════════
# BUILD VERSION — Firmware version string published to HA
# ══════════════════════════════════════════════════════════════════════════════
#
# This text sensor publishes the firmware version to HA every 10 seconds.
# It appears on the About tab of the dashboard and is used to verify which
# version is running on the physical device.
# Update this string every time firmware changes are flashed.
#
text_sensor:
  - platform: template
    name: "Build"                  # → sensor.singularity_build
    id: firmware_version
    icon: "mdi:tag-outline"
    lambda: |-
      return {"v1.1.7"};
    update_interval: 10s
