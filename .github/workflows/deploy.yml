# .github/workflows/deploy.yml
#
# Project: singularity
# Purpose: GitHub Actions CI/CD workflow that automatically syncs the ESPHome
#          YAML configuration files to the Home Assistant Supervisor instance
#          running on a Raspberry Pi whenever changes are pushed to the main
#          branch.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   HA_SSH_KEY — RSA private key for root@192.168.168.3
#                Only this value is secret. All other connection parameters
#                are hardcoded below (LAN-only, not sensitive):
#                  host: 192.168.168.3  |  port: 22
#                  user: root           |  path: /config/esphome
#
# What this workflow does:
#   1. Checks out the repository.
#   2. Uses rsync over SSH to copy all *.yaml files (excluding secrets.yaml)
#      to the ESPHome config directory on the Raspberry Pi.
#   3. Logs a deployment summary.

name: singularity — deploy to Home Assistant

on:
  push:
    branches:
      - main
    paths:
      - "*.yaml"
      - "gpio_map.md"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    name: Sync configs to Home Assistant (Raspberry Pi)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout singularity repository
        uses: actions/checkout@v4

      # ── 2. Install rsync ──────────────────────────────────────────────────
      - name: Install rsync
        run: sudo apt-get install -y rsync

      # ── 3. Write SSH private key ──────────────────────────────────────────
      # printf ensures a trailing newline — SSH rejects keys without one.
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HA_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 22 192.168.168.3 >> ~/.ssh/known_hosts 2>/dev/null

      # ── 4. Sync YAML files to Home Assistant ──────────────────────────────
      # Excludes secrets.yaml — that file must be managed manually on the Pi
      # and must never be committed to the repository.
      - name: Rsync configs to HA ESPHome directory
        run: |
          rsync -avz --delete \
            --exclude="secrets.yaml" \
            --exclude=".git/" \
            --exclude=".github/" \
            -e "ssh -p 22 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ \
            root@192.168.168.3:/config/esphome/

      # ── 5. Summary ────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "✅ singularity configs synced to 192.168.168.3:/config/esphome"
          echo "   Triggered by: ${{ github.actor }} on branch ${{ github.ref_name }}"
          echo "   Commit: ${{ github.sha }}"
