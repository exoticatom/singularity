# .github/workflows/deploy.yml
#
# Project: singularity
# Purpose: GitHub Actions CI/CD workflow that automatically syncs the ESPHome
#          YAML configuration files to the Home Assistant Supervisor instance
#          running on a Raspberry Pi whenever changes are pushed to the main
#          branch.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   HA_SSH_KEY  — RSA private key for root@homeassistant (via Tailscale)
#   TS_AUTHKEY  — Tailscale ephemeral auth key (reusable, ephemeral)
#                 Allows the GitHub runner to join the tailnet temporarily
#                 and reach the Pi at its Tailscale IP: 100.66.190.74
#
# Hardcoded connection parameters (not sensitive):
#   Tailscale IP : 100.66.190.74
#   SSH port     : 22
#   SSH user     : root
#   Config path  : /config/esphome
#
# What this workflow does:
#   1. Checks out the repository.
#   2. Connects the GitHub runner to the Tailscale tailnet.
#   3. Writes the SSH key and syncs YAML files via rsync over Tailscale.
#   4. Logs a deployment summary.

name: singularity — deploy to Home Assistant

on:
  push:
    branches:
      - main
  workflow_dispatch:   # allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    name: Sync configs to Home Assistant (Raspberry Pi via Tailscale)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout singularity repository
        uses: actions/checkout@v4

      # ── 2. Connect to Tailscale ───────────────────────────────────────────
      # Joins the GitHub runner to the tailnet as an ephemeral device.
      # The runner is automatically removed from the tailnet after the job.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes

      # ── 3. Install rsync ──────────────────────────────────────────────────
      - name: Install rsync
        run: sudo apt-get install -y rsync

      # ── 4. Write SSH private key ──────────────────────────────────────────
      # printf ensures a trailing newline — SSH rejects keys without one.
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HA_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # ── 5. Ensure rsync is available on the Pi ────────────────────────────
      # HAOS uses Alpine Linux — rsync is not pre-installed and does not
      # persist across reboots, so we install it before each deploy.
      - name: Install rsync on Pi
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@100.66.190.74 \
            "which rsync || apk add --no-cache rsync"

      # ── 6. Sync ESPHome YAML files to /config/esphome/ ───────────────────
      # Excludes secrets.yaml — managed manually on the Pi, never committed.
      # Also excludes singularity_dashboard.yaml — deployed separately below.
      - name: Rsync ESPHome configs to Pi
        run: |
          rsync -avz --delete \
            --exclude="secrets.yaml" \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="singularity_dashboard.yaml" \
            --exclude="README.md" \
            --exclude="gpio_map.md" \
            --exclude="esphome-web-9de630.yaml" \
            --exclude="esphome-web-833c20.yaml" \
            --exclude="archive/" \
            -e "ssh -p 22 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ \
            root@100.66.190.74:/config/esphome/

      # ── 7. Deploy dashboard to /config/ ───────────────────────────────────
      # singularity_dashboard.yaml is referenced by configuration.yaml via
      # lovelace.dashboards.singularity-brewing — HA loads it automatically.
      # Deployed to /config/ (not /config/esphome/) so HA can find it.
      - name: Deploy dashboard to /config/
        run: |
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            singularity_dashboard.yaml \
            root@100.66.190.74:/config/singularity_dashboard.yaml

      # ── 8. Summary ────────────────────────────────────────────────────────
      - name: Deployment summary
        run: |
          echo "✅ ESPHome configs synced to 100.66.190.74:/config/esphome/"
          echo "✅ Dashboard deployed to 100.66.190.74:/config/singularity_dashboard.yaml"
          echo "   Triggered by: ${{ github.actor }} on branch ${{ github.ref_name }}"
          echo "   Commit: ${{ github.sha }}"
