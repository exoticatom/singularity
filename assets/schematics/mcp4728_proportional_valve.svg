<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="monospace" font-size="12">

  <!-- Background -->
  <rect width="900" height="560" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#4fc3f7" font-size="15" font-weight="bold">singularity — MCP4728 Proportional Valve Wiring</text>
  <text x="450" y="48" text-anchor="middle" fill="#78909c" font-size="11">ESP32-S3 → BSS138 Level Shifter → MCP4728 (5V) → Proportional Valve</text>

  <!-- ─── ESP32 Block ─── -->
  <rect x="30" y="80" width="160" height="200" rx="6" fill="#0d1b2a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="110" y="100" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">ESP32-S3</text>

  <!-- ESP32 pins -->
  <text x="40" y="130" fill="#a5d6a7" font-size="11">3.3V</text>
  <circle cx="190" cy="126" r="3" fill="#a5d6a7"/>
  <line x1="80" y1="126" x2="190" y2="126" stroke="#a5d6a7" stroke-width="1.5"/>

  <text x="40" y="160" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="190" cy="156" r="3" fill="#ef9a9a"/>
  <line x1="72" y1="156" x2="190" y2="156" stroke="#ef9a9a" stroke-width="1.5"/>

  <text x="40" y="195" fill="#fff9c4" font-size="11">GPIO21 SDA</text>
  <circle cx="190" cy="191" r="3" fill="#fff9c4"/>
  <line x1="110" y1="191" x2="190" y2="191" stroke="#fff9c4" stroke-width="1.5"/>

  <text x="40" y="225" fill="#fff9c4" font-size="11">GPIO47 SCL</text>
  <circle cx="190" cy="221" r="3" fill="#fff9c4"/>
  <line x1="110" y1="221" x2="190" y2="221" stroke="#fff9c4" stroke-width="1.5"/>

  <text x="40" y="260" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="190" cy="256" r="3" fill="#ef9a9a"/>
  <line x1="72" y1="256" x2="190" y2="256" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- ─── Level Shifter Block ─── -->
  <rect x="230" y="80" width="180" height="290" rx="6" fill="#0d1b2a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" fill="#ce93d8" font-size="12" font-weight="bold">Level Shifter</text>
  <text x="320" y="115" text-anchor="middle" fill="#ce93d8" font-size="10">(BSS138 bi-directional)</text>

  <!-- LV side labels -->
  <text x="240" y="145" fill="#78909c" font-size="10">LV side (3.3V)</text>
  <text x="240" y="165" fill="#a5d6a7" font-size="11">LV</text>
  <circle cx="230" cy="161" r="3" fill="#a5d6a7"/>

  <text x="240" y="200" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="230" cy="196" r="3" fill="#ef9a9a"/>

  <text x="240" y="232" fill="#fff9c4" font-size="11">LV1 (SDA)</text>
  <circle cx="230" cy="228" r="3" fill="#fff9c4"/>

  <text x="240" y="262" fill="#fff9c4" font-size="11">LV2 (SCL)</text>
  <circle cx="230" cy="258" r="3" fill="#fff9c4"/>

  <!-- HV side labels -->
  <text x="330" y="145" fill="#78909c" font-size="10">HV side (5V)</text>
  <text x="355" y="165" fill="#ffcc80" font-size="11">HV</text>
  <circle cx="410" cy="161" r="3" fill="#ffcc80"/>

  <text x="355" y="200" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="410" cy="196" r="3" fill="#ef9a9a"/>

  <text x="340" y="232" fill="#fff9c4" font-size="11">HV1 (SDA)</text>
  <circle cx="410" cy="228" r="3" fill="#fff9c4"/>

  <text x="340" y="262" fill="#fff9c4" font-size="11">HV2 (SCL)</text>
  <circle cx="410" cy="258" r="3" fill="#fff9c4"/>

  <!-- divider line in shifter -->
  <line x1="318" y1="130" x2="318" y2="360" stroke="#ce93d8" stroke-width="0.5" stroke-dasharray="4,3"/>

  <!-- ─── Wires ESP32 → Level Shifter LV side ─── -->
  <!-- 3.3V -->
  <line x1="190" y1="126" x2="230" y2="161" stroke="#a5d6a7" stroke-width="1.5"/>
  <!-- GND -->
  <line x1="190" y1="156" x2="230" y2="196" stroke="#ef9a9a" stroke-width="1.5"/>
  <!-- SDA -->
  <line x1="190" y1="191" x2="230" y2="228" stroke="#fff9c4" stroke-width="1.5"/>
  <!-- SCL -->
  <line x1="190" y1="221" x2="230" y2="258" stroke="#fff9c4" stroke-width="1.5"/>

  <!-- ─── MCP4728 Block ─── -->
  <rect x="490" y="80" width="180" height="290" rx="6" fill="#0d1b2a" stroke="#80cbc4" stroke-width="1.5"/>
  <text x="580" y="100" text-anchor="middle" fill="#80cbc4" font-size="12" font-weight="bold">MCP4728</text>
  <text x="580" y="115" text-anchor="middle" fill="#80cbc4" font-size="10">12-bit Quad DAC  0x60</text>

  <text x="500" y="145" fill="#ffcc80" font-size="11">VDD (5V)</text>
  <circle cx="490" cy="141" r="3" fill="#ffcc80"/>

  <text x="500" y="175" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="490" cy="171" r="3" fill="#ef9a9a"/>

  <text x="500" y="210" fill="#fff9c4" font-size="11">SDA</text>
  <circle cx="490" cy="206" r="3" fill="#fff9c4"/>

  <text x="500" y="240" fill="#fff9c4" font-size="11">SCL</text>
  <circle cx="490" cy="236" r="3" fill="#fff9c4"/>

  <text x="500" y="275" fill="#80deea" font-size="11">VOUT A</text>
  <circle cx="670" cy="271" r="3" fill="#80deea"/>
  <line x1="560" y1="271" x2="670" y2="271" stroke="#80deea" stroke-width="1.5"/>

  <text x="500" y="305" fill="#78909c" font-size="11">VOUT B</text>
  <text x="500" y="330" fill="#78909c" font-size="11">VOUT C</text>
  <text x="500" y="355" fill="#78909c" font-size="11">VOUT D</text>
  <text x="580" y="370" text-anchor="middle" fill="#78909c" font-size="10">(spare)</text>

  <!-- ─── Wires Level Shifter HV → MCP4728 ─── -->
  <!-- HV (5V) -->
  <line x1="410" y1="161" x2="490" y2="141" stroke="#ffcc80" stroke-width="1.5"/>
  <!-- GND -->
  <line x1="410" y1="196" x2="490" y2="171" stroke="#ef9a9a" stroke-width="1.5"/>
  <!-- SDA -->
  <line x1="410" y1="228" x2="490" y2="206" stroke="#fff9c4" stroke-width="1.5"/>
  <!-- SCL -->
  <line x1="410" y1="258" x2="490" y2="236" stroke="#fff9c4" stroke-width="1.5"/>

  <!-- ─── 5V PSU Block ─── -->
  <rect x="490" y="400" width="180" height="80" rx="6" fill="#0d1b2a" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="580" y="425" text-anchor="middle" fill="#ffcc80" font-size="12" font-weight="bold">5V PSU</text>
  <text x="580" y="443" text-anchor="middle" fill="#78909c" font-size="10">(USB or 5V rail)</text>

  <text x="500" y="465" fill="#ffcc80" font-size="11">5V</text>
  <circle cx="490" cy="461" r="3" fill="#ffcc80"/>

  <text x="500" y="485" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="490" cy="481" r="3" fill="#ef9a9a"/>

  <!-- 5V PSU → MCP4728 VDD -->
  <line x1="490" y1="461" x2="460" y2="461" stroke="#ffcc80" stroke-width="1.5"/>
  <line x1="460" y1="461" x2="460" y2="141" stroke="#ffcc80" stroke-width="1.5"/>
  <line x1="460" y1="141" x2="490" y2="141" stroke="#ffcc80" stroke-width="1.5"/>

  <!-- 5V PSU → Level Shifter HV -->
  <line x1="490" y1="461" x2="460" y2="461" stroke="#ffcc80" stroke-width="1.5"/>
  <!-- tap to HV on level shifter -->
  <line x1="460" y1="320" x2="430" y2="320" stroke="#ffcc80" stroke-width="1.5"/>
  <line x1="430" y1="320" x2="410" y2="161" stroke="#ffcc80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="415" y="315" fill="#ffcc80" font-size="10">5V</text>

  <!-- GND PSU → MCP4728 + level shifter -->
  <line x1="490" y1="481" x2="450" y2="481" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="450" y1="481" x2="450" y2="171" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="450" y1="171" x2="490" y2="171" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- ─── Proportional Valve Block ─── -->
  <rect x="730" y="220" width="150" height="100" rx="6" fill="#0d1b2a" stroke="#80deea" stroke-width="1.5"/>
  <text x="805" y="245" text-anchor="middle" fill="#80deea" font-size="12" font-weight="bold">Proportional</text>
  <text x="805" y="260" text-anchor="middle" fill="#80deea" font-size="12" font-weight="bold">Valve</text>
  <text x="805" y="278" text-anchor="middle" fill="#78909c" font-size="10">0–5V control input</text>

  <text x="740" y="298" fill="#80deea" font-size="11">Signal</text>
  <circle cx="730" cy="294" r="3" fill="#80deea"/>

  <text x="740" y="318" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="730" cy="314" r="3" fill="#ef9a9a"/>

  <!-- VOUT A → Valve signal -->
  <line x1="670" y1="271" x2="730" y2="294" stroke="#80deea" stroke-width="1.5"/>

  <!-- Valve GND → common GND -->
  <line x1="730" y1="314" x2="710" y2="314" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="710" y1="314" x2="710" y2="481" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="710" y1="481" x2="490" y2="481" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- ─── Legend ─── -->
  <rect x="30" y="420" width="340" height="120" rx="6" fill="#0d1b2a" stroke="#37474f" stroke-width="1"/>
  <text x="200" y="440" text-anchor="middle" fill="#78909c" font-size="11" font-weight="bold">Legend</text>

  <line x1="45" y1="460" x2="85" y2="460" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="95" y="464" fill="#a5d6a7" font-size="11">3.3V power</text>

  <line x1="45" y1="480" x2="85" y2="480" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="95" y="484" fill="#ffcc80" font-size="11">5V power</text>

  <line x1="45" y1="500" x2="85" y2="500" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="95" y="504" fill="#ef9a9a" font-size="11">GND</text>

  <line x1="200" y1="460" x2="240" y2="460" stroke="#fff9c4" stroke-width="1.5"/>
  <text x="250" y="464" fill="#fff9c4" font-size="11">I2C (SDA/SCL)</text>

  <line x1="200" y1="480" x2="240" y2="480" stroke="#80deea" stroke-width="1.5"/>
  <text x="250" y="484" fill="#80deea" font-size="11">DAC output (0–5V)</text>

  <line x1="200" y1="500" x2="240" y2="500" stroke="#ffcc80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="250" y="504" fill="#78909c" font-size="11">5V tap to shifter HV</text>

  <!-- Note -->
  <text x="450" y="530" text-anchor="middle" fill="#546e7a" font-size="10">⚠️  Level shifter required — ESP32 I2C is 3.3V logic, MCP4728 powered at 5V.  Use BSS138 bi-directional module.</text>

</svg>
