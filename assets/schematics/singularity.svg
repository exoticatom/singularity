<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="monospace" font-size="12">

  <!-- Background -->
  <rect width="1200" height="700" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="600" y="28" text-anchor="middle" fill="#4fc3f7" font-size="15" font-weight="bold">singularity — Power &amp; Signal Wiring Overview</text>
  <text x="600" y="46" text-anchor="middle" fill="#78909c" font-size="11">24V PSU → DC-DC 5V → MCP4728 + Level Shifter → Valve    |    24V loop → SM6004 → 4-20mA converter → ADS1115</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 24V PSU -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="70" width="130" height="100" rx="6" fill="#0d1b2a" stroke="#ff8a65" stroke-width="2"/>
  <text x="85" y="92" text-anchor="middle" fill="#ff8a65" font-size="12" font-weight="bold">24V PSU</text>
  <text x="85" y="108" text-anchor="middle" fill="#78909c" font-size="10">Main supply</text>

  <!-- 24V+ out -->
  <text x="28" y="128" fill="#ff8a65" font-size="11">24V+</text>
  <circle cx="150" cy="124" r="3" fill="#ff8a65"/>
  <line x1="70" y1="124" x2="150" y2="124" stroke="#ff8a65" stroke-width="2"/>

  <!-- GND out -->
  <text x="28" y="155" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="150" cy="151" r="3" fill="#ef9a9a"/>
  <line x1="60" y1="151" x2="150" y2="151" stroke="#ef9a9a" stroke-width="2"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- DC-DC Step Down 24V → 5V -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="200" y="70" width="140" height="100" rx="6" fill="#0d1b2a" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="270" y="92" text-anchor="middle" fill="#ffcc80" font-size="12" font-weight="bold">DC-DC</text>
  <text x="270" y="108" text-anchor="middle" fill="#ffcc80" font-size="10">24V → 5V step-down</text>

  <!-- IN pins -->
  <text x="208" y="128" fill="#ff8a65" font-size="11">IN+</text>
  <circle cx="200" cy="124" r="3" fill="#ff8a65"/>
  <text x="208" y="153" fill="#ef9a9a" font-size="11">IN−</text>
  <circle cx="200" cy="149" r="3" fill="#ef9a9a"/>

  <!-- OUT pins -->
  <text x="306" y="128" fill="#ffcc80" font-size="11">5V</text>
  <circle cx="340" cy="124" r="3" fill="#ffcc80"/>
  <line x1="300" y1="124" x2="340" y2="124" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="306" y="153" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="340" cy="149" r="3" fill="#ef9a9a"/>
  <line x1="300" y1="149" x2="340" y2="149" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- 24V PSU → DC-DC IN -->
  <line x1="150" y1="124" x2="200" y2="124" stroke="#ff8a65" stroke-width="2"/>
  <line x1="150" y1="151" x2="200" y2="149" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- 24V rail horizontal bus (top) -->
  <line x1="150" y1="124" x2="150" y2="400" stroke="#ff8a65" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="155" y="200" fill="#ff8a65" font-size="10" transform="rotate(-90,155,200)">24V bus</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ESP32 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="200" y="220" width="150" height="210" rx="6" fill="#0d1b2a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="275" y="242" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">ESP32-S3</text>

  <text x="210" y="268" fill="#a5d6a7" font-size="11">3.3V out</text>
  <circle cx="350" cy="264" r="3" fill="#a5d6a7"/>
  <line x1="270" y1="264" x2="350" y2="264" stroke="#a5d6a7" stroke-width="1.5"/>

  <text x="210" y="295" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="350" cy="291" r="3" fill="#ef9a9a"/>
  <line x1="242" y1="291" x2="350" y2="291" stroke="#ef9a9a" stroke-width="1.5"/>

  <text x="210" y="325" fill="#fff9c4" font-size="11">GPIO21 SDA</text>
  <circle cx="350" cy="321" r="3" fill="#fff9c4"/>
  <line x1="282" y1="321" x2="350" y2="321" stroke="#fff9c4" stroke-width="1.5"/>

  <text x="210" y="352" fill="#fff9c4" font-size="11">GPIO47 SCL</text>
  <circle cx="350" cy="348" r="3" fill="#fff9c4"/>
  <line x1="282" y1="348" x2="350" y2="348" stroke="#fff9c4" stroke-width="1.5"/>

  <!-- ESP32 powered from 5V via onboard reg note -->
  <text x="210" y="400" fill="#78909c" font-size="10">5V → onboard</text>
  <text x="210" y="413" fill="#78909c" font-size="10">reg → 3.3V</text>
  <circle cx="200" cy="409" r="3" fill="#ffcc80"/>
  <!-- 5V bus → ESP32 5V pin -->
  <line x1="340" y1="149" x2="340" y2="409" stroke="#ffcc80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="340" y1="409" x2="200" y2="409" stroke="#ffcc80" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Level Shifter -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="400" y="220" width="160" height="230" rx="6" fill="#0d1b2a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="480" y="242" text-anchor="middle" fill="#ce93d8" font-size="12" font-weight="bold">Level Shifter</text>
  <text x="480" y="257" text-anchor="middle" fill="#ce93d8" font-size="10">BSS138 bi-directional</text>

  <text x="408" y="280" fill="#78909c" font-size="10">LV (3.3V) side</text>
  <text x="480" y="280" fill="#78909c" font-size="10">HV (5V) side</text>

  <text x="408" y="302" fill="#a5d6a7" font-size="11">LV</text>
  <circle cx="400" cy="298" r="3" fill="#a5d6a7"/>
  <text x="510" y="302" fill="#ffcc80" font-size="11">HV</text>
  <circle cx="560" cy="298" r="3" fill="#ffcc80"/>

  <text x="408" y="328" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="400" cy="324" r="3" fill="#ef9a9a"/>
  <text x="510" y="328" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="560" cy="324" r="3" fill="#ef9a9a"/>

  <text x="408" y="358" fill="#fff9c4" font-size="11">LV1 SDA</text>
  <circle cx="400" cy="354" r="3" fill="#fff9c4"/>
  <text x="500" y="358" fill="#fff9c4" font-size="11">HV1 SDA</text>
  <circle cx="560" cy="354" r="3" fill="#fff9c4"/>

  <text x="408" y="385" fill="#fff9c4" font-size="11">LV2 SCL</text>
  <circle cx="400" cy="381" r="3" fill="#fff9c4"/>
  <text x="500" y="385" fill="#fff9c4" font-size="11">HV2 SCL</text>
  <circle cx="560" cy="381" r="3" fill="#fff9c4"/>

  <line x1="479" y1="265" x2="479" y2="440" stroke="#ce93d8" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- ESP32 → Level Shifter LV -->
  <line x1="350" y1="264" x2="400" y2="298" stroke="#a5d6a7" stroke-width="1.5"/>
  <line x1="350" y1="291" x2="400" y2="324" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="350" y1="321" x2="400" y2="354" stroke="#fff9c4" stroke-width="1.5"/>
  <line x1="350" y1="348" x2="400" y2="381" stroke="#fff9c4" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- MCP4728 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="620" y="220" width="160" height="230" rx="6" fill="#0d1b2a" stroke="#80cbc4" stroke-width="1.5"/>
  <text x="700" y="242" text-anchor="middle" fill="#80cbc4" font-size="12" font-weight="bold">MCP4728</text>
  <text x="700" y="257" text-anchor="middle" fill="#80cbc4" font-size="10">12-bit DAC  0x60</text>

  <text x="630" y="282" fill="#ffcc80" font-size="11">VDD (5V)</text>
  <circle cx="620" cy="278" r="3" fill="#ffcc80"/>

  <text x="630" y="308" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="620" cy="304" r="3" fill="#ef9a9a"/>

  <text x="630" y="338" fill="#fff9c4" font-size="11">SDA</text>
  <circle cx="620" cy="334" r="3" fill="#fff9c4"/>

  <text x="630" y="365" fill="#fff9c4" font-size="11">SCL</text>
  <circle cx="620" cy="361" r="3" fill="#fff9c4"/>

  <text x="630" y="398" fill="#80deea" font-size="11">VOUT A →</text>
  <circle cx="780" cy="394" r="3" fill="#80deea"/>
  <line x1="690" y1="394" x2="780" y2="394" stroke="#80deea" stroke-width="1.5"/>

  <text x="630" y="425" fill="#546e7a" font-size="11">VOUT B–D</text>
  <text x="700" y="442" text-anchor="middle" fill="#546e7a" font-size="10">(spare)</text>

  <!-- Level Shifter HV → MCP4728 -->
  <line x1="560" y1="298" x2="620" y2="278" stroke="#ffcc80" stroke-width="1.5"/>
  <line x1="560" y1="324" x2="620" y2="304" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="560" y1="354" x2="620" y2="334" stroke="#fff9c4" stroke-width="1.5"/>
  <line x1="560" y1="381" x2="620" y2="361" stroke="#fff9c4" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Proportional Valve -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="840" y="330" width="150" height="90" rx="6" fill="#0d1b2a" stroke="#80deea" stroke-width="1.5"/>
  <text x="915" y="355" text-anchor="middle" fill="#80deea" font-size="12" font-weight="bold">Proportional</text>
  <text x="915" y="370" text-anchor="middle" fill="#80deea" font-size="12" font-weight="bold">Valve</text>
  <text x="915" y="385" text-anchor="middle" fill="#78909c" font-size="10">0–5V signal</text>

  <text x="848" y="404" fill="#80deea" font-size="11">Signal</text>
  <circle cx="840" cy="400" r="3" fill="#80deea"/>
  <text x="848" y="420" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="840" cy="416" r="3" fill="#ef9a9a"/>

  <line x1="780" y1="394" x2="840" y2="400" stroke="#80deea" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 5V bus wiring to Level Shifter HV and MCP4728 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 5V vertical bus -->
  <line x1="340" y1="124" x2="340" y2="149" stroke="#ffcc80" stroke-width="1.5"/>
  <!-- 5V bus down to MCP4728 area -->
  <line x1="590" y1="149" x2="590" y2="278" stroke="#ffcc80" stroke-width="1.5"/>
  <line x1="340" y1="149" x2="590" y2="149" stroke="#ffcc80" stroke-width="1.5"/>
  <line x1="590" y1="278" x2="620" y2="278" stroke="#ffcc80" stroke-width="1.5"/>
  <!-- tap to Level Shifter HV -->
  <line x1="590" y1="298" x2="560" y2="298" stroke="#ffcc80" stroke-width="1.5"/>
  <circle cx="590" cy="278" r="3" fill="#ffcc80"/>
  <line x1="590" y1="278" x2="590" y2="298" stroke="#ffcc80" stroke-width="1.5"/>

  <!-- GND bus -->
  <line x1="340" y1="149" x2="340" y2="600" stroke="#ef9a9a" stroke-width="1" stroke-dasharray="2,4"/>
  <line x1="340" y1="600" x2="900" y2="600" stroke="#ef9a9a" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="600" y="615" text-anchor="middle" fill="#ef9a9a" font-size="10">Common GND bus</text>
  <!-- Valve GND to bus -->
  <line x1="840" y1="416" x2="820" y2="416" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="820" y1="416" x2="820" y2="600" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- SM6004 Flow Sensor -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="20" y="460" width="140" height="110" rx="6" fill="#0d1b2a" stroke="#ff8a65" stroke-width="1.5"/>
  <text x="90" y="482" text-anchor="middle" fill="#ff8a65" font-size="12" font-weight="bold">SM6004</text>
  <text x="90" y="497" text-anchor="middle" fill="#78909c" font-size="10">Flow sensor</text>

  <text x="28" y="518" fill="#ff8a65" font-size="11">GND</text>
  <circle cx="20" cy="514" r="3" fill="#ef9a9a"/>

  <text x="28" y="540" fill="#ef9a9a" font-size="11">OUT (4-20mA)</text>
  <circle cx="160" cy="536" r="3" fill="#ffab91"/>
  <line x1="115" y1="536" x2="160" y2="536" stroke="#ffab91" stroke-width="1.5"/>

  <!-- VCC (24V) on right side → wire goes right to 24V bus -->
  <text x="28" y="562" fill="#ff8a65" font-size="11">VCC (24V) →</text>
  <circle cx="160" cy="558" r="3" fill="#ff8a65"/>
  <line x1="115" y1="558" x2="160" y2="558" stroke="#ff8a65" stroke-width="2"/>

  <!-- 24V bus → SM6004 VCC (from right side) -->
  <line x1="150" y1="400" x2="150" y2="558" stroke="#ff8a65" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="150" y1="558" x2="160" y2="558" stroke="#ff8a65" stroke-width="2"/>
  <circle cx="150" cy="400" r="4" fill="#ff8a65"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- 4-20mA Converter Module -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="220" y="460" width="160" height="140" rx="6" fill="#0d1b2a" stroke="#ffab91" stroke-width="1.5"/>
  <text x="300" y="482" text-anchor="middle" fill="#ffab91" font-size="12" font-weight="bold">4-20mA</text>
  <text x="300" y="497" text-anchor="middle" fill="#ffab91" font-size="10">Converter (XY-IT0V)</text>

  <text x="228" y="520" fill="#ff8a65" font-size="11">VIN+ (24V)</text>
  <circle cx="220" cy="516" r="3" fill="#ff8a65"/>

  <text x="228" y="542" fill="#ef9a9a" font-size="11">VIN− GND</text>
  <circle cx="220" cy="538" r="3" fill="#ef9a9a"/>

  <text x="228" y="564" fill="#ffab91" font-size="11">I+ (signal)</text>
  <circle cx="220" cy="560" r="3" fill="#ffab91"/>

  <text x="228" y="586" fill="#ef9a9a" font-size="11">I− GND</text>
  <circle cx="220" cy="582" r="3" fill="#ef9a9a"/>

  <!-- VOUT -->
  <text x="330" y="520" fill="#a5d6a7" font-size="11">VOUT</text>
  <circle cx="380" cy="516" r="3" fill="#a5d6a7"/>
  <line x1="358" y1="516" x2="380" y2="516" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="330" y="540" fill="#78909c" font-size="10">0–3.3V</text>
  <text x="330" y="555" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="380" cy="551" r="3" fill="#ef9a9a"/>
  <line x1="358" y1="551" x2="380" y2="551" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- SM6004 OUT → Converter I+ -->
  <line x1="160" y1="536" x2="220" y2="560" stroke="#ffab91" stroke-width="1.5"/>

  <!-- 24V → Converter VIN+ -->
  <line x1="150" y1="516" x2="220" y2="516" stroke="#ff8a65" stroke-width="2"/>
  <circle cx="150" cy="516" r="4" fill="#ff8a65"/>

  <!-- GND → Converter VIN− and I− -->
  <line x1="340" y1="600" x2="220" y2="600" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- ADS1115 -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="440" y="460" width="160" height="90" rx="6" fill="#0d1b2a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="520" y="482" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">ADS1115</text>
  <text x="520" y="497" text-anchor="middle" fill="#4fc3f7" font-size="10">16-bit ADC  0x48</text>

  <text x="448" y="520" fill="#a5d6a7" font-size="11">VDD (3.3V)</text>
  <circle cx="440" cy="516" r="3" fill="#a5d6a7"/>

  <text x="448" y="542" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="440" cy="538" r="3" fill="#ef9a9a"/>

  <text x="540" y="520" fill="#a5d6a7" font-size="11">A2 (FLOW1)</text>

  <!-- Converter VOUT → ADS1115 A2 -->
  <line x1="380" y1="516" x2="440" y2="516" stroke="#a5d6a7" stroke-width="1.5"/>

  <!-- 3.3V from ESP32 → ADS1115 VDD -->
  <line x1="350" y1="264" x2="350" y2="516" stroke="#a5d6a7" stroke-width="1" stroke-dasharray="3,4"/>
  <text x="355" y="490" fill="#a5d6a7" font-size="10">3.3V</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- Legend -->
  <!-- ═══════════════════════════════════════════════════════ -->
  <rect x="650" y="460" width="530" height="170" rx="6" fill="#0d1b2a" stroke="#37474f" stroke-width="1"/>
  <text x="915" y="480" text-anchor="middle" fill="#78909c" font-size="12" font-weight="bold">Legend</text>

  <line x1="665" y1="500" x2="705" y2="500" stroke="#ff8a65" stroke-width="2"/>
  <text x="715" y="504" fill="#ff8a65" font-size="11">24V power</text>

  <line x1="665" y1="522" x2="705" y2="522" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="715" y="526" fill="#ffcc80" font-size="11">5V power</text>

  <line x1="665" y1="544" x2="705" y2="544" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="715" y="548" fill="#a5d6a7" font-size="11">3.3V power / analog signal</text>

  <line x1="665" y1="566" x2="705" y2="566" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="715" y="570" fill="#ef9a9a" font-size="11">GND (common bus)</text>

  <line x1="865" y1="522" x2="905" y2="522" stroke="#ffab91" stroke-width="1.5"/>
  <text x="915" y="526" fill="#ffab91" font-size="11">4-20mA current loop</text>

  <line x1="865" y1="544" x2="905" y2="544" stroke="#80deea" stroke-width="1.5"/>
  <text x="915" y="548" fill="#80deea" font-size="11">DAC output 0–5V → valve</text>

  <line x1="865" y1="566" x2="905" y2="566" stroke="#ff8a65" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="915" y="570" fill="#78909c" font-size="11">24V distribution bus</text>

  <text x="915" y="620" text-anchor="middle" fill="#546e7a" font-size="10">⚠️  All GNDs must share a common ground — PSU, ESP32, modules, valve.</text>

</svg>
