<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" font-family="monospace" font-size="12">

  <!-- Background -->
  <rect width="1400" height="700" fill="#1a1a2e"/>

  <!-- Title -->
  <text x="700" y="28" text-anchor="middle" fill="#4fc3f7" font-size="15" font-weight="bold">singularity — Power &amp; Signal Wiring Overview</text>
  <text x="700" y="46" text-anchor="middle" fill="#78909c" font-size="11">24V PSU → DC-DC 5V → ESP32 → Level Shifter → MCP4728 → Valve    |    24V loop → SM6004 → 4-20mA converter → ADS1115</text>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- 24V PSU  x=20 -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="20" y="70" width="130" height="100" rx="6" fill="#0d1b2a" stroke="#ff8a65" stroke-width="2"/>
  <text x="85" y="92" text-anchor="middle" fill="#ff8a65" font-size="12" font-weight="bold">24V PSU</text>
  <text x="85" y="108" text-anchor="middle" fill="#78909c" font-size="10">Main supply</text>
  <text x="28" y="128" fill="#ff8a65" font-size="11">24V+</text>
  <circle cx="150" cy="124" r="3" fill="#ff8a65"/>
  <line x1="70" y1="124" x2="150" y2="124" stroke="#ff8a65" stroke-width="2"/>
  <text x="28" y="155" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="150" cy="151" r="3" fill="#ef9a9a"/>
  <line x1="60" y1="151" x2="150" y2="151" stroke="#ef9a9a" stroke-width="2"/>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- DC-DC Step Down  x=200 -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="200" y="70" width="140" height="100" rx="6" fill="#0d1b2a" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="270" y="92" text-anchor="middle" fill="#ffcc80" font-size="12" font-weight="bold">DC-DC</text>
  <text x="270" y="108" text-anchor="middle" fill="#ffcc80" font-size="10">24V → 5V step-down</text>
  <text x="208" y="128" fill="#ff8a65" font-size="11">IN+</text>
  <circle cx="200" cy="124" r="3" fill="#ff8a65"/>
  <text x="208" y="153" fill="#ef9a9a" font-size="11">IN−</text>
  <circle cx="200" cy="149" r="3" fill="#ef9a9a"/>
  <text x="306" y="128" fill="#ffcc80" font-size="11">5V</text>
  <circle cx="340" cy="124" r="3" fill="#ffcc80"/>
  <line x1="300" y1="124" x2="340" y2="124" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="306" y="153" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="340" cy="149" r="3" fill="#ef9a9a"/>
  <line x1="300" y1="149" x2="340" y2="149" stroke="#ef9a9a" stroke-width="1.5"/>
  <!-- 24V PSU → DC-DC IN -->
  <line x1="150" y1="124" x2="200" y2="124" stroke="#ff8a65" stroke-width="2"/>
  <line x1="150" y1="151" x2="200" y2="149" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- 24V vertical bus (dashed) down from PSU -->
  <line x1="150" y1="124" x2="150" y2="600" stroke="#ff8a65" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="155" y="310" fill="#ff8a65" font-size="10" transform="rotate(-90,155,310)">24V bus</text>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- SM6004  x=20  y=280  (left of ESP32, middle row)           -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="20" y="280" width="140" height="120" rx="6" fill="#0d1b2a" stroke="#ff8a65" stroke-width="1.5"/>
  <text x="90" y="302" text-anchor="middle" fill="#ff8a65" font-size="12" font-weight="bold">SM6004</text>
  <text x="90" y="317" text-anchor="middle" fill="#78909c" font-size="10">Flow sensor</text>
  <!-- GND on left -->
  <text x="28" y="338" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="20" cy="334" r="3" fill="#ef9a9a"/>
  <!-- OUT on right -->
  <text x="55" y="358" fill="#ffab91" font-size="11">OUT (4-20mA)</text>
  <circle cx="160" cy="354" r="3" fill="#ffab91"/>
  <line x1="115" y1="354" x2="160" y2="354" stroke="#ffab91" stroke-width="1.5"/>
  <!-- VCC (24V) on right -->
  <text x="40" y="380" fill="#ff8a65" font-size="11">VCC (24V) →</text>
  <circle cx="160" cy="376" r="3" fill="#ff8a65"/>
  <line x1="115" y1="376" x2="160" y2="376" stroke="#ff8a65" stroke-width="2"/>
  <!-- 24V bus tap → SM6004 VCC -->
  <line x1="150" y1="280" x2="150" y2="376" stroke="#ff8a65" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="150" y1="376" x2="160" y2="376" stroke="#ff8a65" stroke-width="2"/>
  <circle cx="150" cy="280" r="4" fill="#ff8a65"/>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- 4-20mA Converter  x=200  y=280  (right of SM6004)          -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="200" y="280" width="160" height="160" rx="6" fill="#0d1b2a" stroke="#ffab91" stroke-width="1.5"/>
  <text x="280" y="302" text-anchor="middle" fill="#ffab91" font-size="12" font-weight="bold">4-20mA</text>
  <text x="280" y="317" text-anchor="middle" fill="#ffab91" font-size="10">Converter (XY-IT0V)</text>
  <text x="208" y="340" fill="#ff8a65" font-size="11">VIN+ (24V)</text>
  <circle cx="200" cy="336" r="3" fill="#ff8a65"/>
  <text x="208" y="360" fill="#ef9a9a" font-size="11">VIN− GND</text>
  <circle cx="200" cy="356" r="3" fill="#ef9a9a"/>
  <text x="208" y="380" fill="#ffab91" font-size="11">I+ (signal)</text>
  <circle cx="200" cy="376" r="3" fill="#ffab91"/>
  <text x="208" y="400" fill="#ef9a9a" font-size="11">I− GND</text>
  <circle cx="200" cy="396" r="3" fill="#ef9a9a"/>
  <!-- VOUT on right -->
  <text x="310" y="336" fill="#a5d6a7" font-size="11">VOUT</text>
  <circle cx="360" cy="332" r="3" fill="#a5d6a7"/>
  <line x1="338" y1="332" x2="360" y2="332" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="310" y="353" fill="#78909c" font-size="10">0–3.3V</text>
  <text x="310" y="368" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="360" cy="364" r="3" fill="#ef9a9a"/>
  <line x1="338" y1="364" x2="360" y2="364" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- SM6004 OUT → Converter I+ (horizontal) -->
  <line x1="160" y1="354" x2="200" y2="376" stroke="#ffab91" stroke-width="1.5"/>
  <!-- 24V bus → Converter VIN+ -->
  <line x1="150" y1="336" x2="200" y2="336" stroke="#ff8a65" stroke-width="2"/>
  <circle cx="150" cy="336" r="4" fill="#ff8a65"/>
  <!-- GND → Converter -->
  <line x1="20" y1="334" x2="15" y2="334" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="15" y1="334" x2="15" y2="600" stroke="#ef9a9a" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- ADS1115  x=420  y=260  (right of Converter)                -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="420" y="260" width="220" height="200" rx="6" fill="#0d1b2a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="530" y="282" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">ADS1115</text>
  <text x="530" y="297" text-anchor="middle" fill="#4fc3f7" font-size="10">16-bit ADC  0x48</text>

  <!-- Left side: power pins -->
  <text x="428" y="318" fill="#a5d6a7" font-size="11">VDD (3.3V)</text>
  <circle cx="420" cy="314" r="3" fill="#a5d6a7"/>
  <text x="428" y="338" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="420" cy="334" r="3" fill="#ef9a9a"/>

  <!-- Left side: analog input pins top→down: A3, A2, A1, A0 -->
  <text x="428" y="360" fill="#9e9e9e" font-size="11">A3</text>
  <circle cx="420" cy="356" r="3" fill="#9e9e9e"/>
  <text x="444" y="360" fill="#9e9e9e" font-size="10">(Flow2 — NC)</text>

  <text x="428" y="382" fill="#6a1b9a" font-size="11">A2</text>
  <circle cx="420" cy="378" r="3" fill="#6a1b9a"/>
  <text x="444" y="382" fill="#6a1b9a" font-size="10">(Flow1 — AN1)</text>

  <text x="428" y="404" fill="#e65100" font-size="11">A1</text>
  <circle cx="420" cy="400" r="3" fill="#e65100"/>
  <text x="444" y="404" fill="#e65100" font-size="10">(NTC2-MASH)</text>

  <text x="428" y="426" fill="#e65100" font-size="11">A0</text>
  <circle cx="420" cy="422" r="3" fill="#e65100"/>
  <text x="444" y="426" fill="#e65100" font-size="10">(NTC1-RIMS)</text>

  <!-- Converter VOUT → ADS1115 A2 -->
  <line x1="360" y1="332" x2="390" y2="332" stroke="#6a1b9a" stroke-width="1.5"/>
  <line x1="390" y1="332" x2="390" y2="378" stroke="#6a1b9a" stroke-width="1.5"/>
  <line x1="390" y1="378" x2="420" y2="378" stroke="#6a1b9a" stroke-width="1.5"/>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- ESP32  x=420  y=70  (top, right of DC-DC)                  -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="420" y="70" width="150" height="210" rx="6" fill="#0d1b2a" stroke="#4fc3f7" stroke-width="1.5"/>
  <text x="495" y="92" text-anchor="middle" fill="#4fc3f7" font-size="12" font-weight="bold">ESP32-S3</text>
  <text x="210" y="268" fill="#a5d6a7" font-size="11">3.3V out</text>
  <circle cx="420" cy="264" r="3" fill="#a5d6a7"/>
  <line x1="430" y1="264" x2="420" y2="264" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="430" y="268" fill="#a5d6a7" font-size="11">3.3V out</text>
  <circle cx="570" cy="264" r="3" fill="#a5d6a7"/>
  <line x1="440" y1="264" x2="570" y2="264" stroke="#a5d6a7" stroke-width="1.5"/>

  <text x="430" y="294" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="570" cy="291" r="3" fill="#ef9a9a"/>
  <line x1="460" y1="291" x2="570" y2="291" stroke="#ef9a9a" stroke-width="1.5"/>

  <text x="430" y="324" fill="#fff9c4" font-size="11">GPIO21 SDA</text>
  <circle cx="570" cy="321" r="3" fill="#fff9c4"/>
  <line x1="500" y1="321" x2="570" y2="321" stroke="#fff9c4" stroke-width="1.5"/>

  <text x="430" y="352" fill="#fff9c4" font-size="11">GPIO47 SCL</text>
  <circle cx="570" cy="348" r="3" fill="#fff9c4"/>
  <line x1="500" y1="348" x2="570" y2="348" stroke="#fff9c4" stroke-width="1.5"/>

  <!-- ESP32 5V input (from DC-DC) -->
  <text x="430" y="236" fill="#ffcc80" font-size="10">5V → onboard reg</text>
  <circle cx="420" cy="230" r="3" fill="#ffcc80"/>
  <!-- 5V bus → ESP32 -->
  <line x1="340" y1="124" x2="340" y2="230" stroke="#ffcc80" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="340" y1="230" x2="420" y2="230" stroke="#ffcc80" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 3.3V from ESP32 → ADS1115 VDD (dashed, going down) -->
  <line x1="420" y1="264" x2="395" y2="264" stroke="#a5d6a7" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="395" y1="264" x2="395" y2="314" stroke="#a5d6a7" stroke-width="1" stroke-dasharray="3,4"/>
  <line x1="395" y1="314" x2="420" y2="314" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="397" y="295" fill="#a5d6a7" font-size="10">3.3V</text>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- Level Shifter  x=620  y=70                                  -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="620" y="70" width="160" height="230" rx="6" fill="#0d1b2a" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="700" y="92" text-anchor="middle" fill="#ce93d8" font-size="12" font-weight="bold">Level Shifter</text>
  <text x="700" y="107" text-anchor="middle" fill="#ce93d8" font-size="10">BSS138 bi-directional</text>
  <text x="628" y="130" fill="#78909c" font-size="10">LV (3.3V) side</text>
  <text x="700" y="130" fill="#78909c" font-size="10">HV (5V) side</text>

  <text x="628" y="152" fill="#a5d6a7" font-size="11">LV</text>
  <circle cx="620" cy="148" r="3" fill="#a5d6a7"/>
  <text x="730" y="152" fill="#ffcc80" font-size="11">HV</text>
  <circle cx="780" cy="148" r="3" fill="#ffcc80"/>

  <text x="628" y="178" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="620" cy="174" r="3" fill="#ef9a9a"/>
  <text x="730" y="178" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="780" cy="174" r="3" fill="#ef9a9a"/>

  <text x="628" y="208" fill="#fff9c4" font-size="11">LV1 SDA</text>
  <circle cx="620" cy="204" r="3" fill="#fff9c4"/>
  <text x="720" y="208" fill="#fff9c4" font-size="11">HV1 SDA</text>
  <circle cx="780" cy="204" r="3" fill="#fff9c4"/>

  <text x="628" y="235" fill="#fff9c4" font-size="11">LV2 SCL</text>
  <circle cx="620" cy="231" r="3" fill="#fff9c4"/>
  <text x="720" y="235" fill="#fff9c4" font-size="11">HV2 SCL</text>
  <circle cx="780" cy="231" r="3" fill="#fff9c4"/>

  <line x1="699" y1="115" x2="699" y2="290" stroke="#ce93d8" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- ESP32 → Level Shifter LV (orthogonal) -->
  <line x1="570" y1="264" x2="610" y2="264" stroke="#a5d6a7" stroke-width="1.5"/>
  <line x1="610" y1="264" x2="610" y2="148" stroke="#a5d6a7" stroke-width="1.5"/>
  <line x1="610" y1="148" x2="620" y2="148" stroke="#a5d6a7" stroke-width="1.5"/>

  <line x1="570" y1="291" x2="612" y2="291" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="612" y1="291" x2="612" y2="174" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="612" y1="174" x2="620" y2="174" stroke="#ef9a9a" stroke-width="1.5"/>

  <line x1="570" y1="321" x2="620" y2="204" stroke="#fff9c4" stroke-width="1.5"/>
  <line x1="570" y1="348" x2="620" y2="231" stroke="#fff9c4" stroke-width="1.5"/>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- MCP4728  x=840  y=70                                        -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="840" y="70" width="160" height="230" rx="6" fill="#0d1b2a" stroke="#80cbc4" stroke-width="1.5"/>
  <text x="920" y="92" text-anchor="middle" fill="#80cbc4" font-size="12" font-weight="bold">MCP4728</text>
  <text x="920" y="107" text-anchor="middle" fill="#80cbc4" font-size="10">12-bit DAC  0x60</text>

  <text x="848" y="132" fill="#ffcc80" font-size="11">VDD (5V)</text>
  <circle cx="840" cy="128" r="3" fill="#ffcc80"/>
  <text x="848" y="158" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="840" cy="154" r="3" fill="#ef9a9a"/>
  <text x="848" y="188" fill="#fff9c4" font-size="11">SDA</text>
  <circle cx="840" cy="184" r="3" fill="#fff9c4"/>
  <text x="848" y="215" fill="#fff9c4" font-size="11">SCL</text>
  <circle cx="840" cy="211" r="3" fill="#ef9a9a"/>

  <text x="848" y="248" fill="#80deea" font-size="11">VOUT A →</text>
  <circle cx="1000" cy="244" r="3" fill="#80deea"/>
  <line x1="910" y1="244" x2="1000" y2="244" stroke="#80deea" stroke-width="1.5"/>
  <text x="848" y="275" fill="#546e7a" font-size="11">VOUT B–D (spare)</text>

  <!-- Level Shifter HV → MCP4728 (orthogonal) -->
  <line x1="780" y1="148" x2="815" y2="148" stroke="#ffcc80" stroke-width="1.5"/>
  <line x1="815" y1="148" x2="815" y2="128" stroke="#ffcc80" stroke-width="1.5"/>
  <line x1="815" y1="128" x2="840" y2="128" stroke="#ffcc80" stroke-width="1.5"/>

  <line x1="780" y1="174" x2="815" y2="174" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="815" y1="174" x2="815" y2="154" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="815" y1="154" x2="840" y2="154" stroke="#ef9a9a" stroke-width="1.5"/>

  <line x1="780" y1="204" x2="815" y2="204" stroke="#fff9c4" stroke-width="1.5"/>
  <line x1="815" y1="204" x2="815" y2="184" stroke="#fff9c4" stroke-width="1.5"/>
  <line x1="815" y1="184" x2="840" y2="184" stroke="#fff9c4" stroke-width="1.5"/>

  <line x1="780" y1="231" x2="815" y2="231" stroke="#fff9c4" stroke-width="1.5"/>
  <line x1="815" y1="231" x2="815" y2="211" stroke="#fff9c4" stroke-width="1.5"/>
  <line x1="815" y1="211" x2="840" y2="211" stroke="#fff9c4" stroke-width="1.5"/>

  <!-- 5V bus → LS HV + MCP4728 VDD -->
  <line x1="340" y1="124" x2="808" y2="124" stroke="#ffcc80" stroke-width="1.5"/>
  <circle cx="340" cy="124" r="3" fill="#ffcc80"/>
  <!-- tap to LS HV -->
  <line x1="790" y1="124" x2="790" y2="148" stroke="#ffcc80" stroke-width="1.5"/>
  <line x1="790" y1="148" x2="780" y2="148" stroke="#ffcc80" stroke-width="1.5"/>
  <circle cx="790" cy="124" r="3" fill="#ffcc80"/>
  <!-- to MCP4728 VDD -->
  <line x1="808" y1="124" x2="808" y2="128" stroke="#ffcc80" stroke-width="1.5"/>
  <line x1="808" y1="128" x2="840" y2="128" stroke="#ffcc80" stroke-width="1.5"/>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- Proportional Valve  x=1060 -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="1060" y="180" width="150" height="90" rx="6" fill="#0d1b2a" stroke="#80deea" stroke-width="1.5"/>
  <text x="1135" y="205" text-anchor="middle" fill="#80deea" font-size="12" font-weight="bold">Proportional</text>
  <text x="1135" y="220" text-anchor="middle" fill="#80deea" font-size="12" font-weight="bold">Valve</text>
  <text x="1135" y="235" text-anchor="middle" fill="#78909c" font-size="10">0–5V signal</text>
  <text x="1068" y="254" fill="#80deea" font-size="11">Signal</text>
  <circle cx="1060" cy="250" r="3" fill="#80deea"/>
  <text x="1068" y="270" fill="#ef9a9a" font-size="11">GND</text>
  <circle cx="1060" cy="266" r="3" fill="#ef9a9a"/>
  <!-- VOUTA → Valve Signal -->
  <line x1="1000" y1="244" x2="1060" y2="250" stroke="#80deea" stroke-width="1.5"/>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- Common GND bus (bottom) -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <line x1="15" y1="600" x2="1120" y2="600" stroke="#ef9a9a" stroke-width="1" stroke-dasharray="2,4"/>
  <text x="600" y="615" text-anchor="middle" fill="#ef9a9a" font-size="10">Common GND bus</text>
  <!-- Valve GND to bus -->
  <line x1="1060" y1="266" x2="1040" y2="266" stroke="#ef9a9a" stroke-width="1.5"/>
  <line x1="1040" y1="266" x2="1040" y2="600" stroke="#ef9a9a" stroke-width="1.5"/>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- Legend -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <rect x="420" y="440" width="530" height="170" rx="6" fill="#0d1b2a" stroke="#37474f" stroke-width="1"/>
  <text x="685" y="460" text-anchor="middle" fill="#78909c" font-size="12" font-weight="bold">Legend</text>
  <line x1="435" y1="470" x2="475" y2="470" stroke="#ff8a65" stroke-width="2"/>
  <text x="485" y="474" fill="#ff8a65" font-size="11">24V power</text>
  <line x1="435" y1="492" x2="475" y2="492" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="485" y="496" fill="#ffcc80" font-size="11">5V power</text>
